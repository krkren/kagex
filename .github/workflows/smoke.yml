# Runs tools/smoketest.py headless against the engine from the newest release package.
# The engine is built from wamsoft/krkrz_dev and isn't part of this repository, so this
# borrows the one the last release shipped (krkrz, libSDL3.so.0 and plugin/).
name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the libraries the engine loads at run time
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libgomp1 fontconfig

      - name: Get the engine from the newest release that has a Linux package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The releases are marked pre-release, so there's no "latest" release to ask for
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name == "kagex_sdl3_linux_release.zip"))][0].tag_name')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error title=No engine::No release has kagex_sdl3_linux_release.zip to take the engine from"
            exit 1
          fi
          echo "Engine from release $tag"
          mkdir -p "$RUNNER_TEMP/engine"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'kagex_sdl3_linux_release.zip' --dir "$RUNNER_TEMP/engine"
          unzip -q "$RUNNER_TEMP/engine/kagex_sdl3_linux_release.zip" -d "$RUNNER_TEMP/engine/pkg"
          cp "$RUNNER_TEMP/engine/pkg/krkrz" "$RUNNER_TEMP/engine/pkg"/libSDL3.so* .
          cp -r "$RUNNER_TEMP/engine/pkg/plugin" .
          chmod +x krkrz

      - name: Smoke test
        run: |
          set +e
          python3 tools/smoketest.py --effekseer required 2>&1 | tee "$RUNNER_TEMP/smoke.txt"
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            # One annotation with the failures and the end of each failing project's engine
            # log, so they show on the pull request without opening the job log
            python3 - "$RUNNER_TEMP/smoke.txt" <<'PY'
          import sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          out, log = [], None
          for line in lines:
              if line.startswith("--- end of the engine log"):
                  log = []
              elif log is not None and line.startswith("kept "):
                  out += ["--- end of the engine log ---"] + log[-30:]
                  log = None
              elif log is not None:
                  log.append(line)
              elif line.startswith(("==", "FAIL", "     ")):
                  out.append(line)
          report = "\n".join(out)[:30000]
          report = report.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=Smoke test failed::" + report)
          PY
          fi
          exit "$status"
