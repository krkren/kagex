# Puts a release's browser build (kagex_sdl3_web.zip) on GitHub Pages.
#
# The release workflow starts this on main once it has published a release (a release it
# creates doesn't fire the release event: GitHub doesn't start workflows for events its own
# token caused). A release published by hand fires it directly, and it can be run by hand
# with a tag. Pages has to be set to deploy from GitHub Actions (Settings > Pages > Source).
# The check job then runs the smoke test on the live site (results in
# ci/platform-results-pages).
name: Web demo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release whose kagex_sdl3_web.zip to deploy"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
      build_id: ${{ steps.staging.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # web-static-host.py and what it adds: the home-screen icons, kagex-web.js, the
          # preview image and the game's names
          sparse-checkout: |
            .github/platforms
            platform/web
            /linux-config.json
            /ios-config.json
          sparse-checkout-cone-mode: false
      # the site's address, for the link previews' absolute URLs
      - id: pages
        uses: actions/configure-pages@v5
      - name: Download the site
        id: staging
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern kagex_sdl3_web.zip
          mkdir site
          unzip -q kagex_sdl3_web.zip -d site
          test -f site/index.html
          # the file list where a static host serves it, coi's reload after its worker is ready,
          # the home-screen manifest and icons, kagex-web.js and the build id (each for zips
          # built before it had them), and link previews with this site's address
          python3 .github/platforms/web-static-host.py site --url "$SITE_URL"
          echo "build=$(python3 -c 'import json;print(json.load(open("site/kagex-build.json"))["build"])')" >> "$GITHUB_OUTPUT"
          # serve.py is for running the site locally
          rm -f site/serve.py
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # The deployed site in headless Chrome, as a first-time visitor: a fresh browser, so the
  # page goes through coi-serviceworker's reload and loads every file from Pages
  check:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/smoketest.py
            .github/platforms
          sparse-checkout-cone-mode: false
      - name: Wait until Pages serves this run's build
        timeout-minutes: 10
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
          EXPECT: ${{ needs.deploy.outputs.build_id }}
        run: |
          # deploy-pages reports success before the CDN has switched over (and Pages caches
          # a page for a good ten minutes): the fresh files and the old ones can be served
          # side by side, a krkrz.js that doesn't match its wasm, the smoke dying on that
          # mismatch. wait the address out, it's what kagex-build.json is stamped with
          for i in $(seq 1 60); do
            got=$(curl -s "$URL/kagex-build.json" | grep -o '[0-9a-f]\{16\}')
            if [ "$got" = "$EXPECT" ]; then
              echo "Pages serving build $got"
              exit 0
            fi
            [ -n "$got" ] && echo "still serving ${got:-none} (want $EXPECT)"
            sleep 10
          done
          echo "Pages never served build $EXPECT"
          exit 1
      - name: Smoke test of the live site
        timeout-minutes: 15
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python3 -m pip install --quiet playwright
          .github/platforms/run-logged.sh smoke python3 -B tools/smoketest.py --target web --url "$URL" --channel chrome --keep
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/platforms/publish-results.sh pages "web demo, run ${{ github.run_id }} (${{ job.status }})"
