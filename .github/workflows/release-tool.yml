# Builds kagex-release (tools/release) for Windows, Linux and macOS (Apple Silicon) and runs
# its smoke test (tools/release/test/smoke.py; on Linux also the screen in headless Chromium),
# with the engine packages of the newest release that has them.
# Each job uploads the tool (kagex-release-<os>) and force-pushes its results to
# ci/platform-results-release-tool-<os>.
name: Release tool

on:
  push:
    branches: ['release-tool/**', main]
    paths: ['tools/release/**', '.github/workflows/release-tool.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: write
  actions: write

env:
  # krkrz_tools is the commit this engine pins (src/tools/krkrz_tools)
  ENGINE_SHA: 21d20e9745e13c9ffe68ae2eb012548afe73aaa8
  # xp3crypt's library (encrypted data.xp3) and scnfile's sealing code (encrypted compiled
  # scenarios), built into the tool from checkouts next to kagex (as platforms.yml pins them)
  XP3CRYPT_SHA: 08ad5f7f8737f2ebea137acefa03b9aa8a41e380
  SCNFILE_SHA: e39c354233ffea9ab850f23ac2c7ad4562ac4ca7

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: windows, name: windows, exe: kagex-release.exe }
          - { os: ubuntu-22.04, preset: linux, name: linux, exe: kagex-release }
          - { os: macos-15, preset: macos, name: macos, exe: kagex-release }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: kagex
      - name: Clone krkrz_tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          sha=$(gh api "repos/wamsoft/krkrz_dev/contents/src/tools/krkrz_tools?ref=$ENGINE_SHA" --jq .sha)
          git clone -q https://github.com/wamsoft/krkrz_tools.git krkrz_tools
          git -C krkrz_tools checkout -q "$sha"
          git -C krkrz_tools submodule update -q --init --recursive
          # next to kagex, where tools/release/CMakeLists.txt looks for them
          for p in xp3crypt:"$XP3CRYPT_SHA" scnfile:"$SCNFILE_SHA"; do
            git clone -q "https://github.com/krkren/${p%%:*}.git" "${p%%:*}"
            git -C "${p%%:*}" checkout -q "${p#*:}"
          done
          ws=$(pwd -W 2>/dev/null || pwd)
          echo "KRKRZ_TOOLS_DIR=$ws/krkrz_tools" >> "$GITHUB_ENV"
          PY=python3; [ "$RUNNER_OS" = Windows ] && PY=python
          echo "PY=$PY" >> "$GITHUB_ENV"
          # the oldest macOS the tool runs on (also for the vcpkg libraries)
          [ "$RUNNER_OS" = macOS ] && echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
          { echo "kagex $(git -C kagex rev-parse HEAD)"; echo "krkrz_tools $sha"; git -C krkrz_tools submodule status
            echo "xp3crypt $(git -C xp3crypt rev-parse HEAD)"; echo "scnfile $(git -C scnfile rev-parse HEAD)"; } | tee results/versions.txt
      # The engine packages for the build tests (kagex_engine_*.zip), from the newest release that
      # has them (the releases are pre-releases, so there's no "latest" to ask for; a tool newer
      # than its engines only notes it). The scripts that make them run in the release workflow
      # and platforms.yml.
      - name: Engine packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name == "kagex_engine_linux.zip"))][0].tag_name')
          if [ -z "$tag" ] || [ "$tag" = null ]; then
            echo "::error title=No engine packages::No release has kagex_engine_linux.zip"
            exit 1
          fi
          echo "engine packages from $tag" | tee results/engines-from.txt
          platforms="windows linux steam macos web"
          case "$RUNNER_OS" in
            Linux) platforms="$platforms android" ;;
            macOS) platforms="$platforms ios" ;;
          esac
          patterns=()
          for p in $platforms; do patterns+=(--pattern "kagex_engine_$p.zip"); done
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D engines "${patterns[@]}"
          for p in $platforms; do test -f "engines/kagex_engine_$p.zip" || { echo "::error::$tag has no kagex_engine_$p.zip"; exit 1; }; done
          ls -l engines | tee results/engines.txt
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        if: runner.os == 'Linux'
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > results/sdk.log 2>&1
      - name: Libraries for the test run
        if: runner.os == 'Linux'
        run: |
          # the engine draws with OpenGL ES through EGL (Mesa), headless with SDL's offscreen driver
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libgomp1 fontconfig > results/apt.log 2>&1
      - name: OpenGL ES for the test run
        # the Windows VM has no GPU driver: the engine gets GLES through Edge's ANGLE (in PATH,
        # not in the packages)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $angle = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeCore", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application" -Recurse -Filter libGLESv2.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($angle) { New-Item -ItemType Directory -Force angle | Out-Null; foreach ($n in 'libEGL.dll', 'libGLESv2.dll', 'd3dcompiler_47.dll') { $f = Join-Path $angle.DirectoryName $n; if (Test-Path $f) { Copy-Item $f angle\ } }; "$PWD\angle" >> $env:GITHUB_PATH; Get-ChildItem angle }
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Set up vcpkg
        id: vcpkg
        run: |
          git clone -q https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = Windows ]; then "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics; else "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics; fi
          ws=$(pwd -W 2>/dev/null || pwd)
          mkdir -p vcpkg-archives
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$ws/vcpkg-archives,readwrite" >> "$GITHUB_ENV"
          echo "sha=$(git -C "$RUNNER_TEMP/vcpkg" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          { cmake --version | head -1; ninja --version; } | tee results/toolchain.txt
      - uses: actions/cache/restore@v4
        with:
          path: vcpkg-archives
          key: vcpkg-release-tool-${{ matrix.name }}-${{ hashFiles('kagex/tools/release/vcpkg.json') }}-${{ steps.vcpkg.outputs.sha }}
          restore-keys: vcpkg-release-tool-${{ matrix.name }}-
      - name: Configure
        working-directory: kagex/tools/release
        run: ../../.github/platforms/run-logged.sh configure cmake --preset ${{ matrix.preset }} "-DKRKRZ_TOOLS_DIR=$KRKRZ_TOOLS_DIR"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: vcpkg-archives
          key: vcpkg-release-tool-${{ matrix.name }}-${{ hashFiles('kagex/tools/release/vcpkg.json') }}-${{ steps.vcpkg.outputs.sha }}
      - name: Build
        working-directory: kagex/tools/release
        run: ../../.github/platforms/run-logged.sh build cmake --build --preset ${{ matrix.preset }}-rel
      - name: Smoke test
        run: |
          exe=kagex/tools/release/build/${{ matrix.preset }}/Release/${{ matrix.exe }}
          ls -l "$exe" | tee results/exe.txt
          case "$RUNNER_OS" in
            Linux) ldd "$exe" >> results/exe.txt; objdump -T "$exe" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 >> results/exe.txt ;;
            macOS) otool -L "$exe" >> results/exe.txt; vtool -show-build "$exe" >> results/exe.txt 2>&1 || true ;;
          esac
          browser=""
          if [ "$RUNNER_OS" = Linux ]; then
            $PY -m pip install --quiet playwright
            $PY -m playwright install --with-deps chromium > /dev/null
            browser=--browser
          fi
          KAGEX_RELEASE_REQUIRE_ENCRYPTION=1 kagex/.github/platforms/run-logged.sh smoke $PY -B kagex/tools/release/test/smoke.py "$exe" $browser --out results/smoke --engines engines
      - name: Pack the tool
        if: always()
        run: |
          mkdir -p out
          cp kagex/tools/release/build/${{ matrix.preset }}/Release/${{ matrix.exe }} out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kagex-release-${{ matrix.name }}
          path: out
          if-no-files-found: warn
      - name: Share the libraries
        # vcpkg's libraries and clipparse's sqlite source, for building the tool where they can't
        # be downloaded (ci/dev-libs-linux). Not worth failing for: two runs at once (main's and a
        # release's) raced here, and the release's lost its push
        if: runner.os == 'Linux' && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir devlibs
          tar czf devlibs/x64-linux.tar.gz -C kagex/tools/release/build/linux vcpkg_installed/x64-linux _deps/sqlite3_amalg-src
          cd devlibs
          git init -q -b libs .
          git add .
          git -c user.name=kagex-ci -c user.email=kagex-ci@users.noreply.github.com commit -q -m "kagex-release libraries, run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/dev-libs-linux
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # per branch, so runs of several branches don't overwrite each other's results
        run: kagex/.github/platforms/publish-results.sh "release-tool-${{ matrix.name }}${{ github.ref_name != 'main' && format('-{0}', github.ref_name) || '' }}" "release tool ${{ matrix.name }}, run ${{ github.run_id }} (${{ job.status }})"
      - name: Stop the whole run on a failure
        # a failed job cancels the others (iOS and Android take the longest), so a
        # release that can't publish stops at once
        if: failure() && github.workflow == 'Release packages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
