# Builds the SDL3 packages for a kagex release on Windows and Linux, unzips and
# smoke-tests each one, and only when all of them pass (and KAGEX_SHA has reached main)
# creates the release tag at KAGEX_SHA and publishes the zips. The platform builds (Linux for
# Steam, web, Android, iOS Simulator, macOS) come from platforms.yml, copied here from the
# release commit and called with it. After publishing, the web build goes on GitHub Pages
# (pages.yml on main). kagex-release (tools/release) comes from release-tool.yml, also called
# with the release commit; tool-check makes its engine packages (kagex_engine_*.zip) from this
# release's packages and builds the sample with them, and publish adds the tool to the Windows
# and Linux zips (tools/) and as downloads of its own, with kagex-lipsync (tools/lipsync, built
# with it) and its models and dictionary (lipsync/ beside it) the same way. Zip package layout, like 0.0.4:
#   krkrz(.exe), SDL3.dll / libSDL3.so.0, plugin/, license.txt, licenses/ (cmake --install of
#   the engine) + data/, template/, doc/, "KAGEX Initial Setup.txt" and krkrz.cf (the
#   engine's options: the Linux/macOS save folder) from the kagex commit.
name: Release packages

on:
  push:
    branches: [ci/windows-release]

permissions:
  contents: write
  actions: write

concurrency:
  group: release-packages
  cancel-in-progress: true

env:
  RELEASE_TAG: "0.11.0"
  KAGEX_SHA: 752dfcb6c64b23d37a2366437cef9b1394cdb630
  # "true" tags and publishes after every package passed; anything else is a dry run
  PUBLISH: "true"
  ENGINE_REPO: https://github.com/wamsoft/krkrz_dev.git
  # the engine commit the Windows tests ran against
  ENGINE_SHA: 21d20e9745e13c9ffe68ae2eb012548afe73aaa8
  # kagex's own plugins, built into the engines (as platforms.yml pins them): xp3crypt
  # (encrypted data.xp3, built into the engine) and scnfile (compiled scenarios, a plugin)
  XP3CRYPT_SHA: 08ad5f7f8737f2ebea137acefa03b9aa8a41e380
  SCNFILE_SHA: e39c354233ffea9ab850f23ac2c7ad4562ac4ca7

jobs:
  release-commit:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=$KAGEX_SHA" >> "$GITHUB_OUTPUT"

  platforms:
    needs: release-commit
    uses: ./.github/workflows/platforms.yml
    with:
      ref: ${{ needs.release-commit.outputs.sha }}
    permissions:
      contents: write
      actions: write

  release-tool:
    needs: release-commit
    uses: ./.github/workflows/release-tool.yml
    with:
      ref: ${{ needs.release-commit.outputs.sha }}
    permissions:
      contents: write
      actions: write

  windows:
    runs-on: windows-2022
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    env:
      CONFIG: ${{ matrix.config }}
      VSLANG: "1033"
    steps:
      - name: Check out kagex at the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KAGEX_SHA }}
          path: kagex

      - name: Check out the CI scripts
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Clone engine (recursive)
        shell: bash
        run: |
          mkdir -p results
          git clone --depth 1 --recursive --shallow-submodules -j 8 -b master "$ENGINE_REPO" krkrz_dev
          if [ "$(git -C krkrz_dev rev-parse HEAD)" != "$ENGINE_SHA" ]; then
            rm -rf krkrz_dev
            git clone --recursive -j 8 "$ENGINE_REPO" krkrz_dev
            git -C krkrz_dev checkout "$ENGINE_SHA"
            git -C krkrz_dev submodule update --init --recursive
          fi
          for p in xp3crypt:"$XP3CRYPT_SHA" scnfile:"$SCNFILE_SHA"; do
            git clone -q "https://github.com/krkren/${p%%:*}.git" "${p%%:*}"
            git -C "${p%%:*}" checkout -q "${p#*:}"
          done
          {
            echo "kagex $KAGEX_SHA ($(git -C kagex log -1 --format=%s))"
            echo "engine $ENGINE_REPO @ $(git -C krkrz_dev rev-parse HEAD)"
            echo "xp3crypt $(git -C xp3crypt rev-parse HEAD), scnfile $(git -C scnfile rev-parse HEAD)"
            echo "windows $CONFIG, runner $ImageOS $ImageVersion"
          } | tee results/versions.txt

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\vcpkg-archives" | Out-Null
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$env:GITHUB_WORKSPACE\vcpkg-archives,readwrite" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-archives
          key: vcpkg-x64-windows-static-${{ hashFiles('krkrz_dev/src/core/vcpkg.json', 'krkrz_dev/src/plugins/*/vcpkg.json', 'krkrz_dev/src/core/external/*/vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure engine (preset x64-windows = SDL3)
        shell: pwsh
        working-directory: krkrz_dev
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { python -m pip install --quiet ninja }
          # xp3crypt built into the engine, scnfile a plugin beside it. tp_stub, ncbind and
          # simplebinder are krkrz_dev's: the first plugin's CMakeLists caches them relative to
          # itself, and these -D lists come before krkrz_dev's own (kagex's CLAUDE.md)
          $ws = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $p = "$ws/krkrz_dev/src/plugins"
          # quoted: PowerShell splits an unquoted -DNAME=3.5 at the dot
          cmake --preset x64-windows '-DKRKRZ_BUILD_TOOLS=OFF' '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' `
            "-DTVP_PLUGIN_FOLDERS=$ws/xp3crypt/plugins;$ws/scnfile/plugins" '-DTVP_PLUGINS=xp3crypt;scnfile' '-DTVP_PLUGINS_STATIC=xp3crypt' `
            "-DTPSTUB_DIR=$p/tp_stub" "-DNCBIND_DIR=$p/ncbind" "-DSIMPLEBIND_DIR=$p/simplebinder" 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\configure.log" | Select-Object -Last 20
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build engine and all plugins
        shell: pwsh
        working-directory: krkrz_dev
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build build/x64-windows --config $env:CONFIG 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\results\build.log" | Select-String -Pattern ' error |FAILED:|fatal error' | Select-Object -Last 200
          if ($LASTEXITCODE) { Get-Content "$env:GITHUB_WORKSPACE\results\build.log" -Tail 80; exit $LASTEXITCODE }

      - name: Install and package
        shell: pwsh
        run: |
          $name = "kagex_sdl3_windows_$($env:CONFIG.ToLower()).zip"
          "PKG_NAME=$name" >> $env:GITHUB_ENV
          cmake --install krkrz_dev/build/x64-windows --config $env:CONFIG --prefix stage
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item -Recurse stage\* pkg\
          foreach ($exe in 'krkrz64.exe', 'krkrz64d.exe') {
            if (Test-Path "pkg\$exe") { Move-Item "pkg\$exe" pkg\krkrz.exe -Force }
          }
          if (Test-Path pkg\plugin64) { Move-Item pkg\plugin64 pkg\plugin }
          foreach ($p in 'data', 'template', 'doc', 'KAGEX Initial Setup.txt', 'krkrz.cf') { Copy-Item -Recurse "kagex\$p" pkg\ }
          foreach ($need in 'krkrz.exe', 'SDL3.dll', 'license.txt', 'licenses', 'data\startup.tjs', 'krkrz.cf',
                            'template\system\notosansjp-regular.otf', 'template\system\YesNoDialogLayer.tjs',
                            'plugin\KAGParserEx.dll', 'plugin\csvParser.dll', 'plugin\layerExBTOA.dll', 'plugin\layerExImage.dll',
                            'plugin\layerExRaster.dll', 'plugin\scriptsEx.dll', 'plugin\shrinkCopy.dll', 'plugin\extrans.dll',
                            'plugin\krkr_richtext.dll', 'plugin\krkreffekseer.dll', 'data\effect\sparkle.efk',
                            'plugin\extNagano.dll', 'data\rule\rule_shatter.png', 'plugin\layerExVector.dll',
                            'data\fgimage\emblem.svg', 'plugin\minizip.dll', 'plugin\clipfile.dll', 'data\fgimage\emblem.clip',
                            'data\main\charinit.csv', 'data\fgimage\pip\pip_0.txt', 'data\voice\pip000001.ogg',
                            'plugin\json.dll', 'plugin\sigcheck.dll', 'template\system\SceneParser.tjs',
                            'template\system\KAGEnvPlayer.tjs', 'template\system\SignatureCheck.tjs',
                            'template\system\hashed-bootstrap.tjs', 'data\scenario\!scnlist.txt', 'data\main\searchmode.ks',
                            'plugin\scnfile.dll') {
            if (-not (Test-Path "pkg\$need")) { throw "package is missing $need" }
          }
          # kagex-release writes a game's keys into these slots: xp3crypt's in the engine (built in),
          # scnfile's in its plugin
          python ci/.github/release-build/key-slots.py pkg/krkrz.exe pkg/plugin/scnfile.dll
          Push-Location pkg
          7z a -tzip -mx=9 "..\$name" * | Select-Object -Last 3
          Pop-Location
          Get-ChildItem -Recurse pkg -File | Where-Object { $_.FullName -notmatch '\\(data|template)\\' } |
            ForEach-Object { "{0,12} {1}" -f $_.Length, $_.FullName.Substring((Resolve-Path pkg).Path.Length + 1) } |
            Set-Content results\package-files.txt
          "$name $((Get-Item $name).Length) bytes, SHA256 $((Get-FileHash $name).Hash)" | Tee-Object -FilePath results\package.txt

      - name: Smoke-test the package
        shell: pwsh
        run: |
          New-Item -Force 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' | Out-Null
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' DontShowUI 1
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { "Set-DisplayResolution: $_" }
          Expand-Archive $env:PKG_NAME smoke
          # The VM has no GPU driver: give the engine GLES through Edge's ANGLE (test only, not packaged)
          $angle = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeCore", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application" -Recurse -Filter libGLESv2.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          foreach ($n in 'libEGL.dll', 'libGLESv2.dll', 'd3dcompiler_47.dll') {
            $f = Join-Path $angle.DirectoryName $n; if (Test-Path $f) { Copy-Item $f smoke\ }
          }
          & ci\.github\windows-test\run-kagex.ps1 -Kagex smoke -Out results\smoke -Mode "windows-$env:CONFIG" -Plan smoke -BootTimeout 300
          Get-Process krkrz -ErrorAction SilentlyContinue | Stop-Process -Force
          & ci\.github\windows-test\check-smoke.ps1 results\smoke\steps.md

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}
          compression-level: 0
          retention-days: 7

      - name: Publish results branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci/.github/windows-test/publish-results.sh "release-results-windows-${CONFIG,,}" "Windows $CONFIG package, run ${{ github.run_id }} (${{ job.status }})"
      - name: Stop the whole run on a failure
        # a failed job cancels the others (iOS and Android take the longest), so a
        # release that can't publish stops at once
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    env:
      CONFIG: ${{ matrix.config }}
      CC: gcc-12
      CXX: g++-12
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out kagex at the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KAGEX_SHA }}
          path: kagex

      - name: Check out the CI scripts
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Build dependencies
        timeout-minutes: 40
        run: |
          mkdir -p results
          exec > >(tee -a results/apt.log) 2>&1
          # 0.0.5's first run hung here for 20 minutes on both jobs: bound each apt call, wait
          # for a dpkg lock instead of failing, and retry a stalled download
          apt_opts="-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 -o DPkg::Lock::Timeout=600"
          for try in 1 2 3; do
            echo "$(date -u +%T) apt-get update ($try)"
            sudo timeout 300 apt-get update -q $apt_opts && break
          done
          # vcpkg ports, SDL3 (X11 + Wayland + audio backends), and Xvfb/Mesa for the smoke test.
          # No system CJK fonts: the game ships Noto Sans JP (template/system), and the smoke test
          # should show that it draws with it.
          echo "$(date -u +%T) apt-get install"
          sudo -E timeout 1500 apt-get install -y -q --no-install-recommends $apt_opts \
            -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
            ninja-build nasm autoconf autoconf-archive automake libtool pkg-config bison flex gcc-12 g++-12 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev \
            xvfb libgl1-mesa-dri libegl-mesa0 zip
          echo "$(date -u +%T) installed"
          mkdir -p results
          { gcc-12 --version | head -1; cmake --version | head -1; ldd --version | head -1; } | tee results/toolchain.txt

      - name: Clone engine (recursive)
        run: |
          git clone --depth 1 --recursive --shallow-submodules -j 8 -b master "$ENGINE_REPO" krkrz_dev
          if [ "$(git -C krkrz_dev rev-parse HEAD)" != "$ENGINE_SHA" ]; then
            rm -rf krkrz_dev
            git clone --recursive -j 8 "$ENGINE_REPO" krkrz_dev
            git -C krkrz_dev checkout "$ENGINE_SHA"
            git -C krkrz_dev submodule update --init --recursive
          fi
          for p in xp3crypt:"$XP3CRYPT_SHA" scnfile:"$SCNFILE_SHA"; do
            git clone -q "https://github.com/krkren/${p%%:*}.git" "${p%%:*}"
            git -C "${p%%:*}" checkout -q "${p#*:}"
          done
          {
            echo "kagex $KAGEX_SHA ($(git -C kagex log -1 --format=%s))"
            echo "engine $ENGINE_REPO @ $(git -C krkrz_dev rev-parse HEAD)"
            echo "xp3crypt $(git -C xp3crypt rev-parse HEAD), scnfile $(git -C scnfile rev-parse HEAD)"
            echo "linux $CONFIG, runner $ImageOS $ImageVersion"
          } | tee results/versions.txt

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-archives"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/vcpkg-archives,readwrite" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-archives
          key: vcpkg-x64-linux-${{ hashFiles('krkrz_dev/src/core/vcpkg.json', 'krkrz_dev/src/plugins/*/vcpkg.json', 'krkrz_dev/src/core/external/*/vcpkg.json') }}
          restore-keys: vcpkg-x64-linux-

      - name: Configure engine (preset x64-linux)
        working-directory: krkrz_dev
        env:
          # tp_stub.h uses ptrdiff_t without <cstddef>; GCC 12's headers don't pull it in for
          # the plugins that include tp_stub.h first (layerExSave, sigcheck, krkreffekseer, ...)
          CXXFLAGS: -include cstddef
        # krkreffekseer-odr.cmake: the Debug libkrkreffekseer.so needs Effekseer's static members
        # defined, or it won't load (see the file)
        run: |
          set -o pipefail
          # xp3crypt built into the engine, scnfile a plugin beside it (see the Windows job)
          p="$GITHUB_WORKSPACE/krkrz_dev/src/plugins"
          cmake --preset x64-linux -DKRKRZ_BUILD_TOOLS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "-DTVP_PLUGIN_FOLDERS=$GITHUB_WORKSPACE/xp3crypt/plugins;$GITHUB_WORKSPACE/scnfile/plugins" "-DTVP_PLUGINS=xp3crypt;scnfile" -DTVP_PLUGINS_STATIC=xp3crypt \
            "-DTPSTUB_DIR=$p/tp_stub" "-DNCBIND_DIR=$p/ncbind" "-DSIMPLEBIND_DIR=$p/simplebinder" \
            -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/ci/.github/release-build/krkreffekseer-odr.cmake" \
            -DKAGEX_EFK_ODR="$GITHUB_WORKSPACE/kagex/.github/platforms/krkreffekseer-odr.cpp" \
            2>&1 | tee "$GITHUB_WORKSPACE/results/configure.log" | tail -20
          grep -q "kagex: Effekseer's static members are defined in efk_core" "$GITHUB_WORKSPACE/results/configure.log"

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-archives
          key: vcpkg-x64-linux-${{ hashFiles('krkrz_dev/src/core/vcpkg.json', 'krkrz_dev/src/plugins/*/vcpkg.json', 'krkrz_dev/src/core/external/*/vcpkg.json') }}-${{ github.run_id }}-${{ matrix.config }}

      - name: Build engine and all plugins
        working-directory: krkrz_dev
        env:
          CXXFLAGS: -include cstddef
        run: |
          # Keep going past failures, then drop any plugin that does not build on this
          # toolchain (CLAUDE.md: krkrthreepp with newer GCC) and build again without it
          if ! cmake --build build/x64-linux --config "$CONFIG" -- -k 0 > "$GITHUB_WORKSPACE/results/build.log" 2>&1; then
            grep -E 'FAILED: ' "$GITHUB_WORKSPACE/results/build.log" | head -20
            failed=$(grep -oE 'FAILED: (\[code=[0-9]+\] )?core/plugins/[^/ ]+' "$GITHUB_WORKSPACE/results/build.log" | sed 's|.*/||' | sort -u)
            [ -n "$failed" ] || { tail -80 "$GITHUB_WORKSPACE/results/build.log"; exit 1; }
            for t in $failed; do
              dir=$(grep -lE "krkrz_plugin\(\s*$t\b|add_library\(\s*$t\b" src/plugins/*/CMakeLists.txt | head -1 | xargs -r dirname | xargs -r basename)
              dir=${dir:-$t}
              echo "dropping plugin $dir (target $t)" | tee -a "$GITHUB_WORKSPACE/results/dropped-plugins.txt"
              sed -i -E "s/^($dir)$/#\1/" CMakeLists.txt
            done
            cmake --preset x64-linux -DKRKRZ_BUILD_TOOLS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 > /dev/null
            cmake --build build/x64-linux --config "$CONFIG" > "$GITHUB_WORKSPACE/results/build2.log" 2>&1 || { tail -80 "$GITHUB_WORKSPACE/results/build2.log"; exit 1; }
          fi

      - name: krkr_richtext must load on its own (relink if needed)
        working-directory: krkrz_dev/build/x64-linux
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/results/richtext-link.log") 2>&1
          so="core/plugins/krkr_richtext/$CONFIG/libkrkr_richtext.so"
          check() { python3 -c "import ctypes, os, sys; ctypes.CDLL(sys.argv[1], mode=os.RTLD_NOW | os.RTLD_LOCAL)" "$so"; }
          if check; then echo "loads as built"; exit 0; fi
          # CLAUDE.md: its link line repeats libfreetype.a after harfbuzz, past the
          # png/zlib/bzip2/brotli archives freetype needs. Relink with them at the end.
          cmd=$(ninja -f "build-$CONFIG.ninja" -t commands "$so" | tail -1)
          cmd=${cmd% && :}
          ft=$(grep -oE '[^ ]*vcpkg_installed/x64-linux/[^ ]*libfreetype[^ ]*\.a' <<<"$cmd" | head -1)
          dir=$(dirname "$ft")
          extra=""
          for n in png16 z bz2 brotlidec brotlicommon; do
            f=""
            for c in "$dir/lib${n}d.a" "$dir/lib${n}.a"; do [ -f "$c" ] && { f=$c; break; }; done
            if [ -n "$f" ]; then extra="$extra $f"; else echo "no lib$n in $dir"; fi
          done
          echo "relinking with:$extra -lm"
          eval "$cmd $extra -lm"
          check
          echo "loads after relink"

      - name: Install and package
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/results/package.log") 2>&1
          set -x
          name="kagex_sdl3_linux_${CONFIG,,}.zip"
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
          cmake --install krkrz_dev/build/x64-linux --config "$CONFIG" --prefix stage
          mkdir pkg
          # krkrz finds libSDL3.so.0 next to it ($ORIGIN); ship that one file, dereferenced, like 0.0.2
          sdl=$(ls stage/libSDL3.so.0 stage/libSDL3.so.0.* stage/libSDL3.so 2>/dev/null | head -1)
          [ -n "$sdl" ] || { ls -la stage; echo "no libSDL3 in the install"; exit 1; }
          cp -L "$sdl" pkg/libSDL3.so.0
          for f in stage/*; do
            case "$(basename "$f")" in libSDL3.so*) ;; *) cp -a "$f" pkg/ ;; esac
          done
          cp -a kagex/data kagex/template kagex/doc "kagex/KAGEX Initial Setup.txt" kagex/krkrz.cf pkg/
          # libkrkr_richtext.so has linked without libpng & co. on some toolchains (CLAUDE.md);
          # it, libkrkreffekseer.so, the transition plugins, liblayerExVector.so, libminizip.so,
          # libclipfile.so, libjson.so (compiled scenarios), libsigcheck.so (signed builds) and
          # libscnfile.so (compiled scenarios as .scn) must load on their own
          python3 - <<'EOF'
          import ctypes, glob, os, sys
          bad = []
          for so in sorted(glob.glob("pkg/plugin/*.so")):
              try: ctypes.CDLL(so, mode=os.RTLD_NOW | os.RTLD_LOCAL)
              except OSError as e: bad.append(f"{so}: {e}")
          print("\n".join(bad) or "all plugins load")
          sys.exit(1 if any(n in b for b in bad for n in ("krkr_richtext", "krkreffekseer", "extNagano", "extrans", "layerExVector", "minizip", "clipfile", "libjson", "sigcheck", "scnfile")) else 0)
          EOF
          for need in krkrz libSDL3.so.0 license.txt licenses data/startup.tjs krkrz.cf template/system/notosansjp-regular.otf \
                      template/system/YesNoDialogLayer.tjs plugin/libKAGParserEx.so plugin/libcsvParser.so \
                      plugin/liblayerExBTOA.so plugin/liblayerExImage.so plugin/liblayerExRaster.so plugin/libscriptsEx.so \
                      plugin/libshrinkCopy.so plugin/libextrans.so plugin/libkrkr_richtext.so plugin/libkrkreffekseer.so \
                      plugin/libextNagano.so data/effect/sparkle.efk data/rule/rule_shatter.png \
                      plugin/liblayerExVector.so data/fgimage/emblem.svg plugin/libminizip.so plugin/libclipfile.so \
                      data/fgimage/emblem.clip data/main/charinit.csv data/fgimage/pip/pip_0.txt data/voice/pip000001.ogg \
                      plugin/libjson.so plugin/libsigcheck.so template/system/SceneParser.tjs template/system/KAGEnvPlayer.tjs \
                      template/system/SignatureCheck.tjs template/system/hashed-bootstrap.tjs 'data/scenario/!scnlist.txt' \
                      data/main/searchmode.ks plugin/libscnfile.so; do
            [ -e "pkg/$need" ] || { echo "package is missing $need"; exit 1; }
          done
          python3 ci/.github/release-build/key-slots.py pkg/krkrz pkg/plugin/libscnfile.so
          ldd pkg/krkrz | tee results/ldd.txt
          (cd pkg && zip -q -9 -r "../$name" .)
          (cd pkg && find . -type f ! -path './data/*' ! -path './template/*' -printf '%12s %P\n' | sort -k2) > results/package-files.txt
          echo "$name $(stat -c%s "$name") bytes, SHA256 $(sha256sum "$name" | cut -d' ' -f1)" | tee results/package.txt

      - name: Smoke-test the package
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/results/smoke.log") 2>&1
          mkdir smoke && (cd smoke && unzip -q "../$PKG_NAME")
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > results/xvfb.log 2>&1 &
          sleep 2
          export DISPLAY=:99 SDL_VIDEO_DRIVER=x11 SDL_AUDIO_DRIVER=dummy
          pwsh -NoProfile -File ci/.github/windows-test/run-kagex.ps1 -Kagex smoke -Out results/smoke -Mode "linux-$CONFIG" -Plan smoke -BootTimeout 300
          pkill -9 krkrz || true
          pwsh -NoProfile -File ci/.github/windows-test/check-smoke.ps1 results/smoke/steps.md

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}
          compression-level: 0
          retention-days: 7

      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci/.github/windows-test/publish-results.sh "release-results-linux-${CONFIG,,}" "Linux $CONFIG package, run ${{ github.run_id }} (${{ job.status }})"
      - name: Stop the whole run on a failure
        # a failed job cancels the others (iOS and Android take the longest), so a
        # release that can't publish stops at once
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # kagex-release with this release's engines: the engine packages, made from the packages
  # above, and a build of the sample for what a Linux runner makes, with the test run
  tool-check:
    needs: [release-commit, windows, linux, platforms, release-tool]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-commit.outputs.sha }}
          path: kagex
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/download-artifact@v4
        with:
          pattern: kagex_sdl3_*.zip
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: kagex-*
          path: platforms
      - name: Engine packages
        run: |
          mkdir -p engines results
          ep="python3 -I kagex/tools/release/scripts/engine-package.py"
          lic=dist/kagex_sdl3_linux_release.zip
          $ep windows dist/kagex_sdl3_windows_release.zip engines/kagex_engine_windows.zip --version "$RELEASE_TAG"
          $ep windows dist/kagex_sdl3_windows_debug.zip engines/kagex_engine_windows_debug.zip --version "$RELEASE_TAG" --debug
          $ep linux dist/kagex_sdl3_linux_release.zip engines/kagex_engine_linux.zip --version "$RELEASE_TAG"
          $ep linux dist/kagex_sdl3_linux_debug.zip engines/kagex_engine_linux_debug.zip --version "$RELEASE_TAG" --debug
          $ep steam "$(ls platforms/kagex-linux/*.tar.gz)" engines/kagex_engine_steam.zip --version "$RELEASE_TAG"
          $ep macos "$(ls platforms/kagex-macos/*.zip)" engines/kagex_engine_macos.zip --version "$RELEASE_TAG" --licenses-from "$lic"
          (cd platforms/kagex-web && zip -q -r ../../web.zip .)
          $ep web web.zip engines/kagex_engine_web.zip --version "$RELEASE_TAG" --licenses-from "$lic"
          cp platforms/kagex-engine-android/kagex_engine_android.zip platforms/kagex-engine-ios/kagex_engine_ios.zip engines/
          # the Android and iOS packages get the engine's licenses from the Linux package
          mkdir lic && (cd lic && unzip -q "../$lic" license.txt 'licenses/*')
          for z in kagex_engine_android.zip kagex_engine_ios.zip; do (cd lic && zip -q -r "../engines/$z" license.txt licenses); done
          ls -l engines | tee results/engines.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages and the libraries for the test run
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > results/sdk.log 2>&1
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libgomp1 fontconfig > results/apt.log 2>&1
      - name: Build the sample with this release's engines
        run: |
          tool=platforms/kagex-release-linux/kagex-release
          chmod +x "$tool"
          # the tool downloads its engines from the release of its own version
          v=$("$tool" --version)
          if [ "$v" != "kagex-release $RELEASE_TAG" ]; then
            echo "::error title=Tool version::kagex-release says '$v': raise the version in tools/release/CMakeLists.txt and vcpkg.json to $RELEASE_TAG"
            exit 1
          fi
          mkdir -p game/template
          cp -r kagex/data kagex/platform kagex/krkrz.cf game/
          cp -r kagex/template/system game/template/
          "$tool" --cli init game
          python3 - <<'EOF'
          import json
          p = "game/release.json"
          s = json.load(open(p))
          s["identity"]["orgName"] = "kagex-ci"
          for k in s["platforms"]:
              s["platforms"][k]["enabled"] = k in ("windows", "linux", "steam", "web", "android")
          s["platforms"]["android"]["applicationId"] = "com.example.kagexci"
          s["output"]["check"] = True
          json.dump(s, open(p, "w"), indent=2)
          EOF
          KAGEX_RELEASE_CACHE="$PWD/cache" "$tool" --cli build game/release.json --engines=engines --json > results/build.json || true
          python3 - <<'EOF'
          import json, re, sys
          t = open("results/build.json").read()
          # the JSON result, after any progress lines
          r = json.loads(t[re.search(r"^\{", t, re.M).start():])
          for o in r["outputs"]:
              print(o["platform"], "ok" if o["ok"] else "FAILED: " + o.get("error", ""), o.get("package") or o.get("folder"))
          print("test run:", r.get("check", {}).get("message"))
          sys.exit(0 if r["ok"] else 1)
          EOF
      - name: Build the sample encrypted with this release's engines
        # every engine has xp3crypt built in and the scnfile plugin: the archive and the compiled
        # scenarios encrypted, each with a key of its own from one keys file, and the Linux
        # build's test run reads them; then the same with the file names hidden (desktop only)
        run: |
          tool=platforms/kagex-release-linux/kagex-release
          "$tool" --cli keygen keys/game-keys.txt
          build() {  # build <name>: results/build-<name>.json, then the outputs and the test run
            KAGEX_RELEASE_CACHE="$PWD/cache" "$tool" --cli build game/release.json --engines=engines --json > "results/build-$1.json" || true
            python3 - "$1" <<'EOF'
          import json, re, sys
          t = open("results/build-%s.json" % sys.argv[1]).read()
          r = json.loads(t[re.search(r"^\{", t, re.M).start():])
          for o in r["outputs"]:
              print(o["platform"], "ok" if o["ok"] else "FAILED: " + o.get("error", ""), o.get("package") or o.get("folder"))
          for n in r.get("notes", []):
              print("note:", n)
          chk = r.get("check", {})
          print("test run:", chk.get("message"), "; ".join(chk.get("errors", [])))
          sys.exit(0 if r["ok"] and chk.get("ok") is True else 1)
          EOF
          }
          python3 - <<'EOF'
          import json
          p = "game/release.json"
          s = json.load(open(p))
          s["keys"] = {"file": "../keys/game-keys.txt"}
          s["archive"]["encrypt"] = True
          s["scenes"]["compile"] = True
          s["scenes"]["encrypt"] = True
          s["output"]["folder"] = "release-encrypted"
          s["output"]["check"] = True
          for k in s["platforms"]:
              s["platforms"][k]["enabled"] = k in ("windows", "linux", "steam", "web", "android")
          s["platforms"]["web"]["data"] = "xp3"   # loose files ("files") aren't encrypted
          json.dump(s, open(p, "w"), indent=2)
          EOF
          build encrypted
          python3 - <<'EOF'
          import glob, json, re, sys
          # stored uncompressed, so an unencrypted script would show in an archive as it is: data.xp3
          # and the media archives beside it (scenario.xp3...)
          arcs = sorted(glob.glob("game/release-encrypted/*-linux/*.xp3"))
          data = b"".join(open(a, "rb").read() for a in arcs)
          leak = [w for w in (b"sf.software_title", b"KAGLinkPlugin", b"macro name") if w in data]
          print("archives:", " ".join(a.rsplit("/", 1)[1] for a in arcs), len(data), "bytes; plain text found:", leak or "none")
          if not any(a.endswith("/data.xp3") for a in arcs) or not any(a.endswith("/bgimage.xp3") for a in arcs):
              sys.exit("no data.xp3 and bgimage.xp3: the desktop build should be split")
          # what the build says it did
          t = open("results/build-encrypted.json").read()
          prot = json.loads(t[re.search(r"^\{", t, re.M).start():]).get("protection", {})
          print("protection:", prot)
          ok = prot.get("archive") == "encrypted" and prot.get("scenes") == "encrypted"
          sys.exit(1 if not data or leak or not ok else 0)
          EOF
          python3 - <<'EOF'
          import json
          p = "game/release.json"
          s = json.load(open(p))
          s["archive"]["hideNames"] = True
          s["output"]["folder"] = "release-hidden"
          for k in s["platforms"]:
              s["platforms"][k]["enabled"] = k in ("windows", "linux")
          # the probe's image stays as it is (converted, it would be 名前テスト.tlg)
          s["media"]["images"].update({"opaque": "keep", "alpha": "keep"})
          json.dump(s, open(p, "w"), indent=2)
          EOF
          # the release's engines read an image named in Japanese with an upper-case extension by its
          # lower-case name (xp3crypt 08ad5f7), and 0.9.4's bootstrap runs the game's startup.tjs:
          # a probe at its end says both in the test run's log
          cp "game/data/bgimage/$(ls game/data/bgimage | grep -m1 '\.png$')" "game/data/image/名前テスト.PNG"
          cat >> game/data/startup.tjs <<'EOF'

          // release workflow probe (tool-check, hidden names)
          Debug.message("kagex-test: startup.tjs ran");
          try {
              var probe = new global.Layer(kag, kag.fore.base);
              probe.loadImages("名前テスト.png");
              Debug.message("kagex-test: an upper-case extension loads " + probe.imageWidth);
              invalidate probe;
          } catch (e) {
              Debug.message("kagex-test: an upper-case extension fails: " + e.message);
          }
          EOF
          build hidden
          python3 - <<'EOF'
          import json, re, sys
          t = open("results/build-hidden.json").read()
          prot = json.loads(t[re.search(r"^\{", t, re.M).start():]).get("protection", {})
          print("protection:", prot)
          sys.exit(0 if prot.get("archive") == "encrypted, names hidden" and prot.get("scenes") == "encrypted" else 1)
          EOF
          ls -la game/release-hidden/*-linux | tee results/hidden-names.txt
          # data.xp3 and the media archives, every name in them hashed but data.xp3's startup.tjs,
          # and no data folder or data.xpc
          test -f game/release-hidden/*-linux/data.xp3
          test -f game/release-hidden/*-linux/bgimage.xp3
          test ! -e game/release-hidden/*-linux/data
          test ! -e game/release-hidden/*-linux/data.xpc
          python3 - <<'EOF' | tee -a results/hidden-names.txt
          import glob, re, sys, zlib
          def names(path):
              d = open(path, "rb").read()
              ofs = int.from_bytes(d[11:19], "little")
              while d[ofs] & 0x80:   # the "continue" header of the cushion form
                  ofs = int.from_bytes(d[ofs + 9:ofs + 17], "little")
              flag, n = d[ofs], int.from_bytes(d[ofs + 1:ofs + 9], "little")
              index = zlib.decompress(d[ofs + 17:ofs + 17 + n]) if flag & 7 == 1 else d[ofs + 9:ofs + 9 + n]
              out, i = [], 0
              while i + 12 <= len(index):
                  size = int.from_bytes(index[i + 4:i + 12], "little")
                  body, j = index[i + 12:i + 12 + size], 0
                  while j + 12 <= len(body):
                      sz = int.from_bytes(body[j + 4:j + 12], "little")
                      if body[j:j + 4] == b"info":
                          k = int.from_bytes(body[j + 32:j + 34], "little")
                          out.append(body[j + 34:j + 34 + k * 2].decode("utf-16-le"))
                      j += 12 + sz
                  i += 12 + size
              return out
          bad = {}
          for a in sorted(glob.glob("game/release-hidden/*-linux/*.xp3")):
              plain = [n for n in names(a) if not re.fullmatch(r"[0-9a-f]{32}", n)]
              print(a.rsplit("/", 1)[1], len(names(a)), "names, kept:", plain)
              if plain != (["startup.tjs"] if a.endswith("/data.xp3") else []): bad[a] = plain
          sys.exit("names not hidden: %s" % bad if bad else 0)
          EOF
          python3 - <<'EOF' | tee -a results/hidden-names.txt
          import sys
          # the probe's own lines (an exception's code dump lists the script's strings too, after "// *")
          log = open("game/release-hidden/test-run.log", encoding="utf-8", errors="replace").read()
          said = [l.strip() for l in log.splitlines() if "kagex-test:" in l and "// *" not in l]
          print("probe:", " | ".join(said))
          ran = any(l.endswith("kagex-test: startup.tjs ran") for l in said)
          loads = any("kagex-test: an upper-case extension loads" in l for l in said)
          sys.exit(0 if ran and loads else "the game's startup.tjs ran: %s; the upper-case extension loads: %s" % (ran, loads))
          EOF
          # signed as well (the keys file has the signing key too): every protection at once, then
          # signed and encrypted without the names hidden. The Linux test runs must report the
          # signatures verified (SignatureCheck.tjs checks data.xp3, then each media archive)
          signed() {  # signed <name> <hide names: 0|1>
            python3 - "$1" "$2" <<'EOF'
          import json, sys
          p = "game/release.json"
          s = json.load(open(p))
          s["signing"]["enabled"] = True
          s["archive"]["hideNames"] = sys.argv[2] == "1"
          s["output"]["folder"] = "release-" + sys.argv[1]
          for k in s["platforms"]:
              s["platforms"][k]["enabled"] = k in ("windows", "linux")
          json.dump(s, open(p, "w"), indent=2)
          EOF
            build "$1"
            python3 - "$1" "$2" <<'EOF'
          import json, re, sys
          t = open("results/build-%s.json" % sys.argv[1]).read()
          prot = json.loads(t[re.search(r"^\{", t, re.M).start():]).get("protection", {})
          print("protection:", prot)
          want = "encrypted, names hidden" if sys.argv[2] == "1" else "encrypted"
          sys.exit(0 if prot.get("archive") == want and prot.get("scenes") == "encrypted" and prot.get("signed") is True else 1)
          EOF
          }
          signed signed 1
          test -f game/release-signed/*-linux/data.xp3.sig
          test -f game/release-signed/*-linux/bgimage.xp3.sig
          test ! -e game/release-signed/*-linux/data
          signed signed-xp3 0
          test -f game/release-signed-xp3/*-linux/data.xp3.sig
          test -f game/release-signed-xp3/*-linux/voice.xp3.sig
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-engine-packages
          path: engines/*.zip
          compression-level: 0
          retention-days: 7
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp game/release/test-run.log game/release/android-build.log results/ 2>/dev/null || true
          for d in release-encrypted release-hidden release-signed release-signed-xp3; do
            for f in test-run.log compile-scenarios.log compile-scripts.log; do cp "game/$d/$f" "results/$d-$f" 2>/dev/null || true; done
          done
          ci/.github/windows-test/publish-results.sh release-results-tool-check "kagex-release with $RELEASE_TAG's engines, run ${{ github.run_id }} (${{ job.status }})"
      - name: Stop the whole run on a failure
        # a failed job cancels the others (iOS and Android take the longest), so a
        # release that can't publish stops at once
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  publish:
    needs: [windows, linux, platforms, release-tool, tool-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Collect the packages
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: kagex_sdl3_*.zip
          merge-multiple: true
          path: dist

      - name: Collect the platform builds
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: kagex-*
          path: platforms

      - name: Name the platform packages
        if: env.PUBLISH == 'true'
        run: |
          find platforms -maxdepth 3 | sort
          one() { n=$(find "$1" -maxdepth 1 -type f -name "$2" | wc -l); [ "$n" = 1 ] || { echo "::error::expected one $2 in $1, found $n"; exit 1; }; find "$1" -maxdepth 1 -type f -name "$2"; }
          cp "$(one platforms/kagex-linux '*.tar.gz')" dist/kagex_sdl3_linux_steam.tar.gz
          cp "$(one platforms/kagex-android '*.apk')" dist/kagex_sdl3_android.apk
          cp "$(one platforms/kagex-ios-simulator '*.zip')" dist/kagex_sdl3_ios_simulator.zip
          cp "$(one platforms/kagex-macos '*.zip')" dist/kagex_sdl3_macos.zip
          test -f platforms/kagex-web/index.html
          (cd platforms/kagex-web && zip -q -9 -r "$GITHUB_WORKSPACE/dist/kagex_sdl3_web.zip" .)
          ls -l dist

      - name: Collect the engine packages
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@v4
        with:
          name: kagex-engine-packages
          path: dist

      - name: The release tools, in the packages and on their own
        if: env.PUBLISH == 'true'
        run: |
          win=platforms/kagex-release-windows
          lin=platforms/kagex-release-linux
          mac=platforms/kagex-release-macos
          # kagex-release, and kagex-lipsync with its models and dictionary (lipsync/ beside it)
          for d in "$win" "$lin" "$mac"; do
            x=; [ "$d" = "$win" ] && x=.exe
            ls -l "$d/kagex-release$x" "$d/kagex-lipsync$x" || exit 1
            test -f "$d/lipsync/open_jtalk/sys.dic" && test -f "$d/lipsync/pocketsphinx/cmudict-en-us.dict" || { echo "::error::$d has no lipsync/ data"; find "$d/lipsync" -maxdepth 2 | head; exit 1; }
            du -sh "$d/lipsync"
          done
          chmod 755 "$lin/kagex-release" "$lin/kagex-lipsync" "$mac/kagex-release" "$mac/kagex-lipsync"
          # tools/ in the Windows and Linux zips: kagex-release(.exe), kagex-lipsync(.exe), lipsync/
          mkdir -p t/tools
          cp "$win/kagex-release.exe" "$win/kagex-lipsync.exe" t/tools/
          cp -R "$win/lipsync" t/tools/
          for z in kagex_sdl3_windows_release.zip kagex_sdl3_windows_debug.zip; do (cd t && zip -q -r "../dist/$z" tools); done
          rm -rf t/tools/*
          cp -p "$lin/kagex-release" "$lin/kagex-lipsync" t/tools/
          cp -R "$lin/lipsync" t/tools/
          for z in kagex_sdl3_linux_release.zip kagex_sdl3_linux_debug.zip; do (cd t && zip -q -r "../dist/$z" tools); done
          # each on its own: kagex-release alone, kagex-lipsync with its lipsync/
          (cd "$win" && zip -q -9 "$GITHUB_WORKSPACE/dist/kagex-release-windows.zip" kagex-release.exe)
          tar czf dist/kagex-release-linux.tar.gz -C "$lin" kagex-release
          (cd "$mac" && zip -q -9 "$GITHUB_WORKSPACE/dist/kagex-release-macos.zip" kagex-release)
          (cd "$win" && zip -q -9 -r "$GITHUB_WORKSPACE/dist/kagex-lipsync-windows.zip" kagex-lipsync.exe lipsync)
          tar czf dist/kagex-lipsync-linux.tar.gz -C "$lin" kagex-lipsync lipsync
          (cd "$mac" && zip -q -9 -r "$GITHUB_WORKSPACE/dist/kagex-lipsync-macos.zip" kagex-lipsync lipsync)
          ls -l dist

      - name: Wait for the release commit to reach main
        if: env.PUBLISH == 'true'
        timeout-minutes: 240
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The release commit comes in through a pull request; the tag must be on main.
          # Merge it with a merge commit (a squash would leave this commit off main).
          while :; do
            status=$(gh api "repos/$REPO/compare/$KAGEX_SHA...main" --jq .status || echo error)
            case "$status" in
              identical|ahead) echo "$KAGEX_SHA is on main"; break ;;
            esac
            merged=$(gh api "repos/$REPO/commits/$KAGEX_SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length' || echo 0)
            if [ "$merged" != 0 ]; then
              echo "::error::The pull request with $KAGEX_SHA was merged, but main doesn't contain that commit (squashed or rebased?). Publish this run's packages with publish-release.yml after tagging the right commit."
              exit 1
            fi
            echo "$(date -u +%H:%M) main doesn't have $KAGEX_SHA yet ($status); waiting"
            sleep 60
          done

      - name: Tag and publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          # 9 packages, 9 engine packages, and the two tools for 3 systems
          [ "$(ls dist/* | wc -l)" = 24 ] || { echo "expected 24 files"; exit 1; }
          sha256sum dist/*
          if gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "tag $RELEASE_TAG already exists"; exit 1
          fi
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$KAGEX_SHA" > /dev/null
          gh release create "$RELEASE_TAG" dist/* --repo "$REPO" --title "$RELEASE_TAG" \
            --notes-file "ci/.github/release-notes/$RELEASE_TAG.md" --prerelease --verify-tag
          gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,isPrerelease,assets \
            --jq '"\(.tagName) prerelease=\(.isPrerelease)", (.assets[] | "\(.name) \(.size)")'

      # A release made with this token doesn't fire pages.yml's release event: start it
      - name: Put the web build on GitHub Pages
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --repo "$REPO" --ref main -f tag="$RELEASE_TAG"
