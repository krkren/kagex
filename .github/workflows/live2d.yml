# Builds the krkrlive2d plugin (Live2D characters, doc/world.txt "Live2D Characters") with
# Live2D's Cubism SDK for Native on Windows, Linux and macOS (tools/live2d/build.py), and runs the
# sample's smoke test with Live2D required on each platform's engine package from the newest
# release, with Hiyori fetched from Live2D's GitHub (tools/assets/make_hiyori.py). Android and
# iOS link every plugin into the engine, so there the kit builds the engine with the plugin
# (build.py --kit), as platforms.yml builds the sample's apps, and the smoke test runs on an
# emulator and in the Simulator.
#
# The sample game with Live2D: each desktop job also builds the sample as a game with kagex-release
# (built by the tool job from this commit), the plugin in plugins/<platform>/ and Hiyori in its
# data, and runs the smoke test on that package. Started by hand with a release's tag (Actions >
# Live2D > Run workflow, release: the tag), the jobs add those packages, and the Android APK and
# iOS Simulator app kagex-release builds below, to that release as kagex_sample_live2d_<platform>:
# the playable sample, apart from the engine and template packages, which can't carry Live2D's
# Cubism Core (a game may ship it; anything handed to other developers may not). The desktop
# packages hold LIVE2D-NOTICE.txt, the terms that protect the Core; apps take no extra files, so
# for the APK and the Simulator app those terms go in the release's notes.
#
# A game's own engine package (tools/live2d/README.md, "Android and iOS"): the Android and iOS
# jobs also make one from the engine they built, as a developer would (android-engine.py,
# ios-engine.py with --with-cubism-core, and checks that they refuse it without), put it in
# engines/ next to data/ and build the sample from it with kagex-release: the iOS Simulator app
# gets the smoke test with Live2D required, the device .ipa its signature checked, and the
# Android APK (a release build, without the REPL) is started on the emulator and checked by its
# log (.github/platforms/android-start.sh).
#
# The SDK is Live2D's, and its licence keeps it private: it comes from the private repository
# krkren/cubism-sdk through the CUBISM_SDK_TOKEN secret (a fine-grained token that can only read
# that repository's contents). Neither the SDK, nor the plugin or the engines built with it, nor
# Hiyori leaves the runner but in those sample game packages: no artifacts (but the compiled
# scenarios and kagex-release, which hold neither), and the results branches
# (ci/platform-results-live2d-<os>) hold logs only, no pictures.
name: Live2D

on:
  push:
    branches: ['feature/live2d', 'live2d/**', main]
    paths:
      - 'template/system/GFX_Live2D.tjs'
      - 'template/system/KAGEnvCharacter*.tjs'
      - 'template/system/world.tjs'
      - 'template/system/KAGEnvironment.tjs'
      - 'template/system/Initialize.tjs'
      - 'data/main/envinit.tjs'
      - 'data/main/Override.tjs'
      - 'data/scenario/anim.ks'
      - 'data/lang/ja/scenario/anim.ks'
      - 'tools/live2d/**'
      - 'tools/live2d-standin.tjs'
      - 'tools/smoketest.py'
      - 'tools/assets/make_hiyori.py'
      - 'tools/release/src/**'
      - 'tools/release/scripts/engine-package.py'
      - 'tools/release/scripts/android-engine.py'
      - 'tools/release/scripts/ios-engine.py'
      - '.github/platforms/android-start.sh'
      - '.github/platforms/publish-results.sh'
      - 'app-config.json'
      - 'ios-config.json'
      - '.github/workflows/live2d.yml'
  workflow_dispatch:
    inputs:
      release:
        description: "A release's tag: add the Live2D sample game packages to it (empty: only test)"
        required: false
        default: ""

# reading only, but for the jobs that push their results branch and add to a release
permissions:
  contents: read

env:
  # started with a release's tag: the jobs build that tag's code (and the desktop jobs use its
  # engine packages), so what they add to the release is that release's; passed to the shell
  # through the environment, never written into a command
  RELEASE_TAG: ${{ inputs.release }}
  # the SDK in krkren/cubism-sdk (with its .sha256 beside it)
  CUBISM_SDK_ZIP: CubismSdkForNative-5-r.5.zip
  # Android and iOS: the engine, the kits and kagex's plugins, as platforms.yml pins them
  ENGINE_SHA: 21d20e9745e13c9ffe68ae2eb012548afe73aaa8
  KRKRZ_ANDROID_SHA: eff2b17b5df37af29681cc4872da6b5b0bd94d63
  KRKRZ_IOS_SHA: 003abad6e7dc14ef597be566c8b3c4606fb9b7c1
  XP3CRYPT_SHA: 08ad5f7f8737f2ebea137acefa03b9aa8a41e380
  SCNFILE_SHA: e39c354233ffea9ab850f23ac2c7ad4562ac4ca7
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # kagex-release from this commit, for the sample game packages (its own tests are
  # release-tool.yml's): built as release-tool.yml builds it, without kagex-lipsync
  tool:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: windows, name: windows }
          - { os: ubuntu-22.04, preset: linux, name: linux }
          - { os: macos-15, preset: macos, name: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: kagex
          ref: ${{ inputs.release || github.sha }}
      - name: Clone krkrz_tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/wamsoft/krkrz_dev/contents/src/tools/krkrz_tools?ref=$ENGINE_SHA" --jq .sha)
          git clone -q https://github.com/wamsoft/krkrz_tools.git krkrz_tools
          git -C krkrz_tools checkout -q "$sha"
          git -C krkrz_tools submodule update -q --init --recursive
          for p in xp3crypt:"$XP3CRYPT_SHA" scnfile:"$SCNFILE_SHA"; do
            git clone -q "https://github.com/krkren/${p%%:*}.git" "${p%%:*}"
            git -C "${p%%:*}" checkout -q "${p#*:}"
          done
          echo "KRKRZ_TOOLS_DIR=$(pwd -W 2>/dev/null || pwd)/krkrz_tools" >> "$GITHUB_ENV"
          [ "$RUNNER_OS" = macOS ] && echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
          true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Set up vcpkg
        id: vcpkg
        run: |
          git clone -q https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = Windows ]; then "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics; else "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics; fi
          ws=$(pwd -W 2>/dev/null || pwd)
          mkdir -p vcpkg-archives
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$ws/vcpkg-archives,readwrite" >> "$GITHUB_ENV"
          echo "sha=$(git -C "$RUNNER_TEMP/vcpkg" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # release-tool.yml's vcpkg libraries (restore only: that workflow keeps them)
      - uses: actions/cache/restore@v4
        with:
          path: vcpkg-archives
          key: vcpkg-release-tool-${{ matrix.name }}-${{ hashFiles('kagex/tools/release/vcpkg.json') }}-${{ steps.vcpkg.outputs.sha }}
          restore-keys: vcpkg-release-tool-${{ matrix.name }}-
      - name: Build kagex-release
        working-directory: kagex/tools/release
        run: |
          cmake --preset ${{ matrix.preset }} "-DKRKRZ_TOOLS_DIR=$KRKRZ_TOOLS_DIR" -DKAGEX_LIPSYNC=OFF > "$RUNNER_TEMP/configure.log" 2>&1 || { tail -60 "$RUNNER_TEMP/configure.log"; exit 1; }
          cmake --build --preset ${{ matrix.preset }}-rel --target kagex-release
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/${{ matrix.preset }}/Release/kagex-release* "$GITHUB_WORKSPACE/out/"
          ls -l "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: live2d-kagex-release-${{ matrix.name }}
          path: out
          retention-days: 1
          if-no-files-found: error

  live2d:
    needs: tool
    strategy:
      fail-fast: false
      matrix:
        include:
          # the engines are x64 on Windows and arm64 on macOS
          - { os: windows-2022, name: windows, arch: x64, video: windows }
          # Linux in the Steam Runtime's SDK (glibc 2.31), as a game's release would build it
          - { os: ubuntu-24.04, name: linux, arch: '', video: offscreen, buildopts: --steamrt }
          - { os: macos-15, name: macos, arch: arm64, video: cocoa }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release || github.sha }}
      - name: Tools
        run: |
          mkdir -p results
          # never empty, so the results branch is pushed whichever step fails
          echo "${{ github.sha }} on ${{ matrix.os }}, run ${{ github.run_id }}" > results/run.txt
          PY=python3; [ "$RUNNER_OS" = Windows ] && PY=python
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "WORK=$(cd "$RUNNER_TEMP" && (pwd -W 2>/dev/null || pwd))" >> "$GITHUB_ENV"
      - name: The Cubism SDK
        env:
          SDK_TOKEN: ${{ secrets.CUBISM_SDK_TOKEN }}
        run: |
          if [ -z "$SDK_TOKEN" ]; then
            echo "::error title=No Cubism SDK::The CUBISM_SDK_TOKEN secret (read access to krkren/cubism-sdk) isn't set"
            exit 1
          fi
          git clone -q --depth 1 "https://x-access-token:${SDK_TOKEN}@github.com/krkren/cubism-sdk.git" "$WORK/cubism-sdk"
          # the clone keeps its URL, token and all, in .git/config: gone before any other step runs
          chmod -R u+w "$WORK/cubism-sdk/.git"; rm -rf "$WORK/cubism-sdk/.git"
          $PY - "$WORK/cubism-sdk/$CUBISM_SDK_ZIP" <<'PY' | tee results/sdk.txt
          import hashlib, sys
          data = open(sys.argv[1], "rb").read()
          want = open(sys.argv[1] + ".sha256").read().split()[0]
          got = hashlib.sha256(data).hexdigest()
          print("%s: %d bytes, SHA-256 %s" % (sys.argv[1].replace("\\", "/").split("/")[-1], len(data), got))
          sys.exit(0 if got == want else "the SDK's SHA-256 isn't the one recorded beside it")
          PY
      - name: Libraries for the test run
        if: runner.os == 'Linux'
        run: |
          # the engine draws with OpenGL ES through EGL (Mesa), headless with SDL's offscreen driver
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libgomp1 fontconfig > results/apt.log 2>&1
      - name: OpenGL ES for the test run
        # the Windows VM has no GPU driver: the engine gets GLES through Edge's ANGLE (in PATH,
        # not in the packages)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $angle = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeCore", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application" -Recurse -Filter libGLESv2.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($angle) { New-Item -ItemType Directory -Force angle | Out-Null; foreach ($n in 'libEGL.dll', 'libGLESv2.dll', 'd3dcompiler_47.dll') { $f = Join-Path $angle.DirectoryName $n; if (Test-Path $f) { Copy-Item $f angle\ } }; "$PWD\angle" >> $env:GITHUB_PATH; Get-ChildItem angle }
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Build the plugin
        run: |
          { cmake --version | head -1; ninja --version; } | tee results/toolchain.txt
          arch=(); [ -n "${{ matrix.arch }}" ] && arch=(--arch "${{ matrix.arch }}")
          .github/platforms/run-logged.sh build $PY -B tools/live2d/build.py --sdk "$WORK/cubism-sdk/$CUBISM_SDK_ZIP" \
            --work "$WORK/live2d" --out "$WORK/live2d-plugin" "${arch[@]}" ${{ matrix.buildopts }}
          ls -l "$WORK/live2d-plugin" | tee results/plugin.txt
          case "$RUNNER_OS" in
            Linux)
              nm -D --defined-only "$WORK/live2d-plugin/libkrkrlive2d.so" | grep -v ' _' >> results/plugin.txt
              # the libraries it loads, and whether it carries an unwinder of its own (UPSTREAM.md 2)
              readelf -d "$WORK/live2d-plugin/libkrkrlive2d.so" | grep NEEDED >> results/plugin.txt
              echo "its own _Unwind_ functions: $(nm "$WORK/live2d-plugin/libkrkrlive2d.so" 2>/dev/null | grep -c ' [Tt] _Unwind_')" >> results/plugin.txt
              # built in the Steam Runtime: it needs no newer glibc than 2.31
              glibc=$(objdump -T "$WORK/live2d-plugin/libkrkrlive2d.so" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
              echo "needs $glibc" | tee -a results/plugin.txt
              printf '%s\n' "$glibc" "GLIBC_2.31" | sort -CV || { echo "::error title=glibc::the plugin needs $glibc, newer than the Steam Runtime's 2.31"; exit 1; }
              # libstdc++ no newer than Debian 11's (GCC 10), and the shared unwinder, not one of its own
              glibcxx=$(objdump -T "$WORK/live2d-plugin/libkrkrlive2d.so" | grep -oE 'GLIBCXX_[0-9.]+' | sort -uV | tail -1)
              echo "needs $glibcxx" | tee -a results/plugin.txt
              printf '%s\n' "$glibcxx" "GLIBCXX_3.4.28" | sort -CV || { echo "::error title=libstdc++::the plugin needs $glibcxx, newer than GCC 10's"; exit 1; }
              readelf -d "$WORK/live2d-plugin/libkrkrlive2d.so" | grep -q 'libgcc_s' || { echo "::error title=unwinder::the plugin has libgcc linked in, with an unwinder of its own"; exit 1; } ;;
            macOS) otool -L "$WORK/live2d-plugin/libkrkrlive2d.dylib" >> results/plugin.txt; lipo -info "$WORK/live2d-plugin/libkrkrlive2d.dylib" >> results/plugin.txt ;;
          esac
      - name: The engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$RELEASE_TAG
          [ -n "$tag" ] || tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name == "kagex_engine_linux.zip"))][0].tag_name')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error title=No engine::No release has the engine packages"
            exit 1
          fi
          echo "engine package kagex_engine_${{ matrix.name }}.zip from $tag" | tee results/engine.txt
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "kagex_engine_${{ matrix.name }}.zip" --dir "$WORK"
          mkdir -p "$WORK/engine"
          cd "$WORK/engine"
          # unzip keeps the executables' modes (Linux, macOS); Git Bash on Windows has none
          if [ "$RUNNER_OS" = Windows ]; then $PY -m zipfile -e "../kagex_engine_${{ matrix.name }}.zip" .; else unzip -q "../kagex_engine_${{ matrix.name }}.zip"; fi
          case "$RUNNER_OS" in
            Windows)
              cp "$WORK/live2d-plugin/krkrlive2d.dll" plugin/
              cp "$GITHUB_WORKSPACE/krkrz.cf" .
              exe="$WORK/engine/krkrz.exe" ;;
            Linux)
              cp "$WORK/live2d-plugin/libkrkrlive2d.so" plugin/
              cp "$GITHUB_WORKSPACE/krkrz.cf" .
              chmod +x krkrz
              exe="$WORK/engine/krkrz" ;;
            macOS)
              # the plugins sit beside the executable; the package's app is unsigned, and an
              # unsigned app doesn't start: sign it ad hoc
              cp "$WORK/live2d-plugin/libkrkrlive2d.dylib" KAGEX.app/Contents/MacOS/
              cp "$GITHUB_WORKSPACE/krkrz.cf" KAGEX.app/Contents/MacOS/
              codesign --force --deep --sign - KAGEX.app
              exe="$WORK/engine/KAGEX.app/Contents/MacOS/krkrz" ;;
          esac
          echo "ENGINE=$exe" >> "$GITHUB_ENV"
      - name: Hiyori
        run: .github/platforms/run-logged.sh hiyori $PY -B tools/assets/make_hiyori.py model --accept-license
      - name: Smoke test
        timeout-minutes: 30
        env:
          SDL_VIDEO_DRIVER: ${{ matrix.video }}
          SDL_AUDIO_DRIVER: dummy
          # the log in UTF-8 on Windows too (its console's code page has no Japanese)
          PYTHONUTF8: 1
        run: .github/platforms/run-logged.sh smoke $PY -B tools/smoketest.py --engine "$ENGINE" --only sample --keep --live2d required
      - uses: actions/download-artifact@v4
        with:
          name: live2d-kagex-release-${{ matrix.name }}
          path: ${{ runner.temp }}/tool
      - name: The sample game with Live2D
        env:
          SDL_VIDEO_DRIVER: ${{ matrix.video }}
          SDL_AUDIO_DRIVER: dummy
          PYTHONUTF8: 1
        run: |
          tool="$WORK/tool/kagex-release"; [ "$RUNNER_OS" = Windows ] && tool="$tool.exe"
          chmod +x "$tool" 2>/dev/null || true
          "$tool" --version | tee results/sample.txt
          # this checkout as the game: the plugin in plugins/<platform>/, Hiyori in its data (the
          # Hiyori step), Live2D's notice beside the executable
          mkdir -p "plugins/${{ matrix.name }}"
          cp "$WORK/live2d-plugin/"*krkrlive2d* "plugins/${{ matrix.name }}/"
          cp tools/live2d/LIVE2D-NOTICE.txt .
          "$tool" --cli init . >> results/sample.txt
          $PY - "${{ matrix.name }}" <<'PY'
          import json, sys
          s = json.load(open("release.json", encoding="utf-8"))
          for p in s["platforms"]:
              s["platforms"][p]["enabled"] = p == sys.argv[1]
          s["contents"]["extraFiles"] = s["contents"].get("extraFiles", []) + ["LIVE2D-NOTICE.txt"]
          s["output"]["archive"] = "zip"
          json.dump(s, open("release.json", "w", encoding="utf-8"), indent=2)
          PY
          "$tool" --cli check release.json >> results/sample.txt 2>&1 || true
          .github/platforms/run-logged.sh sample-build "$tool" --cli build release.json "--engines=$WORK"
          pkg=$(ls "$PWD"/release/*-${{ matrix.name }}.zip | head -1)
          [ -n "$pkg" ] || { echo "::error::kagex-release made no package"; exit 1; }
          mkdir -p "$WORK/sample"
          (cd "$WORK/sample" && unzip -q "$pkg" 2>/dev/null || $PY -m zipfile -e "$pkg" .)
          case "$RUNNER_OS" in
            Windows) exe=$(ls "$WORK"/sample/*/kagex-sample.exe) ;;
            Linux) exe=$(ls "$WORK"/sample/*/kagex-sample); chmod +x "$exe" ;;
            macOS) exe=$(ls -d "$WORK"/sample/*.app)/Contents/MacOS/krkrz ;;
          esac
          ls "$(dirname "$exe")" >> results/sample.txt
          test -f "$(dirname "$exe")/LIVE2D-NOTICE.txt" || [ "$RUNNER_OS" = macOS ] || { echo "::error::no LIVE2D-NOTICE.txt beside the executable"; exit 1; }
          .github/platforms/run-logged.sh sample-smoke $PY -B tools/smoketest.py --packaged --engine "$exe" --live2d required
          cp "$pkg" "$WORK/kagex_sample_live2d_${{ matrix.name }}.zip"
          ls -l "$WORK/kagex_sample_live2d_${{ matrix.name }}.zip" | tee -a results/sample.txt
      # Live2D's licence asks a game to show its players these terms. kagex-release puts its
      # extraFiles beside the program on the desktops only, and an APK or a .app bundle holds no
      # file like that, so they come along inside the package as README.md (at its root when the
      # package holds a .app, beside the program when it is loose files)
      - name: README.md in the sample package
        env:
          PKG: "${{ env.WORK }}/kagex_sample_live2d_${{ matrix.name }}.zip"
        run: |
          test -f tools/live2d/LIVE2D-NOTICE.txt || { echo "::error::tools/live2d/LIVE2D-NOTICE.txt is missing"; exit 1; }
          $PY - "$PKG" <<'PY'
          import os, sys, zipfile
          pkg = sys.argv[1]
          with zipfile.ZipFile(pkg) as z:
              names = z.namelist()
              notice = [n for n in names if n.split("/")[-1] == "LIVE2D-NOTICE.txt"]
              folder = os.path.dirname(notice[0]) if notice else ""
              if any(n.split("/")[-1] == "README.md" for n in names):
                  sys.exit("README.md is already in " + pkg)
          with zipfile.ZipFile(pkg, "a") as z:
              z.write("tools/live2d/LIVE2D-NOTICE.txt", (folder + "/" if folder else "") + "README.md")
          print("the terms for the players, as README.md in %s (%s)" % (pkg, folder or "the package root"))
          PY
      # what a developer needs to build the Live2D plugin for their own game with the SDK they have
      # licensed: build.py and setup.py, their patches, the driver's CMake, and the script that
      # fetches Hiyori. The SDK, the Cubism Core and Hiyori's files stay outside the repository, so
      # these fetch them on the developer's computer (setup.py asks before each step). The desktop
      # packages only: an APK and an .app bundle can hold no loose files beside the program.
      - name: the Live2D build tools in the sample package
        env:
          PKG: "${{ env.WORK }}/kagex_sample_live2d_${{ matrix.name }}.zip"
        run: |
          $PY - "$PKG" <<'PY'
          import os, sys, zipfile
          pkg = sys.argv[1]
          files = ["tools/assets/make_hiyori.py"]
          for root, dirs, names in os.walk("tools/live2d"):
            for name in sorted(names):
              files.append(os.path.join(root, name))
          with zipfile.ZipFile(pkg, "a") as z:
              have = set(z.namelist())
              for f in files:
                  name = f.replace(os.sep, "/")
                  if name in have:
                      sys.exit(name + " is already in " + pkg)
                  z.write(f, name)
              print("%d files of the Live2D tools into %s" % (len(files), pkg))
          PY
      - name: Add the sample game to the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$WORK/kagex_sample_live2d_${{ matrix.name }}.zip" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # Hiyori is on the screen: no screenshots on a public branch
          RESULTS_NO_PICTURES: 1
        run: .github/platforms/publish-results.sh "live2d-${{ matrix.name }}" "live2d ${{ matrix.name }}, run ${{ github.run_id }} (${{ job.status }})"

  # The sample's scenarios compiled, as platforms.yml's: the app's data is read-only
  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release || github.sha }}
      - name: Install the libraries the engine loads
        run: |
          sudo timeout 600 apt-get install -y -q --no-install-recommends -o DPkg::Lock::Timeout=300 \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libgomp1 fontconfig > /dev/null
      - name: Compile the scenarios
        run: .github/platforms/compile-scenarios.sh . "$RUNNER_TEMP/scenarios.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: live2d-scenarios
          path: ${{ runner.temp }}/scenarios.tgz
          if-no-files-found: error

  android:
    needs: [scenarios, tool]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 150
    env:
      KRKRZ_BASE: ${{ github.workspace }}/kirikiri
      PROJECT_DIR: ${{ github.workspace }}/kirikiri/kagex
    steps:
      - uses: actions/checkout@v4
        with:
          path: kirikiri/kagex
          ref: ${{ inputs.release || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: live2d-scenarios
          path: ${{ runner.temp }}/scenarios
      - name: Put the compiled scenarios into the project
        run: |
          mkdir -p results
          echo "${{ github.sha }} on android, run ${{ github.run_id }}" > results/run.txt
          tar xzf "$RUNNER_TEMP/scenarios/scenarios.tgz" -C kirikiri/kagex && ls kirikiri/kagex/data/scenario/*.scn*
      - name: Clone the engine and krkrz_android
        run: kirikiri/kagex/.github/platforms/setup.sh krkrz_android "$KRKRZ_ANDROID_SHA"
      - name: The Cubism SDK
        env:
          SDK_TOKEN: ${{ secrets.CUBISM_SDK_TOKEN }}
        run: |
          [ -n "$SDK_TOKEN" ] || { echo "::error title=No Cubism SDK::The CUBISM_SDK_TOKEN secret isn't set"; exit 1; }
          git clone -q --depth 1 "https://x-access-token:${SDK_TOKEN}@github.com/krkren/cubism-sdk.git" "$RUNNER_TEMP/cubism-sdk"
          # the clone keeps its URL, token and all, in .git/config: gone before any other step runs
          chmod -R u+w "$RUNNER_TEMP/cubism-sdk/.git"; rm -rf "$RUNNER_TEMP/cubism-sdk/.git"
          got=$(cd "$RUNNER_TEMP/cubism-sdk" && sha256sum "$CUBISM_SDK_ZIP" | cut -d' ' -f1)
          want=$(cut -d' ' -f1 "$RUNNER_TEMP/cubism-sdk/$CUBISM_SDK_ZIP.sha256")
          [ -n "$got" ] && [ "$got" = "$want" ] || { echo "::error title=Cubism SDK::$CUBISM_SDK_ZIP's SHA-256 isn't the one recorded"; exit 1; }
          echo "$CUBISM_SDK_ZIP: SHA-256 as recorded" | tee results/sdk.txt
      - name: Live2D in the engine
        run: |
          kirikiri/kagex/.github/platforms/run-logged.sh kit python3 -B kirikiri/kagex/tools/live2d/build.py \
            --sdk "$RUNNER_TEMP/cubism-sdk/$CUBISM_SDK_ZIP" --work "$RUNNER_TEMP/live2d" --kit "$PROJECT_DIR/app-config.json"
          cat "$RUNNER_TEMP/live2d/kit.env" >> "$GITHUB_ENV"
          python3 -c "import json; c = json.load(open('$PROJECT_DIR/app-config.json'))['cmake']; print(c['pluginFolders'][0]); print(c['plugins'][-1])" | tee -a results/kit.txt
      - name: Hiyori
        run: |
          kirikiri/kagex/.github/platforms/run-logged.sh hiyori python3 -B kirikiri/kagex/tools/assets/make_hiyori.py model --accept-license
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up the Android SDK, vcpkg and SDL3
        run: |
          ndk=$(python3 -c "import json; print(json.load(open('$PROJECT_DIR/app-config.json'))['ndkVersion'])")
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cmake=$("$sdk/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -oE 'cmake;3\.[0-9]+\.[0-9]+' | sort -u -t. -k2,2n -k3,3n | tail -1)
          echo "using $cmake" | tee results/cmake.txt
          kirikiri/kagex/.github/platforms/run-logged.sh sdk "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ndk" "$cmake" "platforms;android-36" "build-tools;36.0.0"
          sed -i -E "s/version = \"3\.22\.1\"/version = \"${cmake#cmake;}\"/" kirikiri/krkrz_android/app/build.gradle
          echo "sdk.dir=$sdk" > kirikiri/krkrz_android/local.properties
          python3 kirikiri/kagex/.github/platforms/kit-vcpkg.py kirikiri/krkrz_android/app/src/main/cpp/vcpkg.json
          echo "include(\"$PROJECT_DIR/.github/platforms/krkreffekseer-kit.cmake\")" >> kirikiri/krkrz_android/app/src/main/cpp/CMakeLists.txt
          echo "include(\"$PROJECT_DIR/.github/platforms/monocypher-kit.cmake\")" >> kirikiri/krkrz_android/app/src/main/cpp/CMakeLists.txt
          chmod +x kirikiri/krkrz_android/gradlew
          git clone -q https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          sudo timeout 600 apt-get install -y -q --no-install-recommends -o DPkg::Lock::Timeout=300 nasm > results/apt.log 2>&1
          mkdir -p kirikiri/krkrz_android/app/libs
          (cd kirikiri/krkrz_android && bash install-sdl-aar.sh) > results/sdl-aar.log 2>&1
      - name: Build the debug APK
        run: kirikiri/kagex/.github/platforms/run-logged.sh build make -C kirikiri/krkrz_android build
      - name: The engine has the plugin
        run: |
          apk=$(find "$PROJECT_DIR/build/android/app/outputs/apk/debug" -name '*.apk' | head -1)
          echo "APK=$apk" >> "$GITHUB_ENV"
          unzip -l "$apk" | grep -E 'lib/|fgimage/hiyori' | tee results/apk.txt
          unzip -o -q "$apk" 'lib/x86_64/*' -d "$RUNNER_TEMP/apklib"
          for f in "$RUNNER_TEMP"/apklib/lib/x86_64/*.so; do
            if strings "$f" | grep -c -E 'Live2DPlayer|csmReviveMocInPlace' > /dev/null; then echo "$(basename "$f") has krkrlive2d and the Cubism Core"; fi
          done | tee -a results/apk.txt
          grep -q "has krkrlive2d" results/apk.txt || { echo "::error title=No Live2D::the engine has no krkrlive2d"; exit 1; }
      # the optimized build, signed with the debug key (the kit's release-debug), as platforms.yml
      # makes the sample's APK: the sample game with Live2D on a release, and what a game's own
      # engine package is made from below
      - name: Build the release APK
        run: |
          # Gradle downloads lint's own dependencies here (three tries, as platforms.yml)
          for try in 1 2 3; do
            kirikiri/kagex/.github/platforms/run-logged.sh release make -C kirikiri/krkrz_android release-debug && break
            [ "$try" = 3 ] && exit 1
            sleep 30
          done
          apk=$(find "$PROJECT_DIR/build/android/app/outputs/apk/releaseDebugSigned" -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::no release APK"; exit 1; }
          echo "RELEASE_APK=$apk" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: live2d-kagex-release-linux
          path: ${{ runner.temp }}/tool
      # A game's own engine package, as tools/live2d/README.md has a developer make it: this
      # engine through android-engine.py (which refuses the Cubism Core without
      # --with-cubism-core) into engines/ next to data/, where kagex-release finds it, then the
      # sample built with kagex-release from it (its host engine, for compiling the scripts and
      # scenarios, from the release, headless)
      - name: A game's own engine package
        run: |
          sudo timeout 600 apt-get install -y -q --no-install-recommends -o DPkg::Lock::Timeout=300 \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libgomp1 fontconfig >> results/apt.log 2>&1
          version=$(python3 -c "import json; print(json.load(open('$PROJECT_DIR/linux-config.json'))['version'])")
          if python3 -I kirikiri/kagex/tools/release/scripts/android-engine.py kirikiri/krkrz_android "$RELEASE_APK" "$RUNNER_TEMP/refused.zip" \
              --version "$version" --app-config "$PROJECT_DIR/app-config.json" > results/engine-refused.txt 2>&1; then
            echo "::error title=Cubism Core::android-engine.py made an engine package holding the Cubism Core without --with-cubism-core"
            exit 1
          fi
          grep -q "Cubism Core" results/engine-refused.txt || { cat results/engine-refused.txt; exit 1; }
          mkdir -p "$PROJECT_DIR/engines"
          python3 -I kirikiri/kagex/tools/release/scripts/android-engine.py kirikiri/krkrz_android "$RELEASE_APK" \
            "$PROJECT_DIR/engines/kagex_engine_android.zip" --version "$version" --app-config "$PROJECT_DIR/app-config.json" \
            --with-cubism-core \
            > results/engine-package.txt 2>&1 || { cat results/engine-package.txt; exit 1; }
          cat results/engine-package.txt
          tool="$RUNNER_TEMP/tool/kagex-release"
          chmod +x "$tool"
          "$tool" --version | tee results/game.txt
          cd "$PROJECT_DIR"
          "$tool" --cli init . >> "$GITHUB_WORKSPACE/results/game.txt"
          python3 - <<'PY'
          import json
          s = json.load(open("release.json", encoding="utf-8"))
          for p in s["platforms"]:
              s["platforms"][p]["enabled"] = p == "android"
          s["output"]["check"] = False
          s["platforms"]["android"].update({"format": "apk", "data": "xp3", "applicationId": "io.github.krkren.kagex.live2d",
                                            "versionCode": 0, "keystore": "", "keyAlias": ""})
          json.dump(s, open("release.json", "w", encoding="utf-8"), indent=2)
          PY
          "$tool" --cli check release.json >> "$GITHUB_WORKSPACE/results/game.txt" 2>&1 || true
          s=0
          .github/platforms/run-logged.sh game-build "$tool" --cli build release.json || s=$?
          cp release/*.log "$GITHUB_WORKSPACE/results/" 2>/dev/null || true
          [ "$s" = 0 ] || exit "$s"
          apk=$(ls "$PWD"/release/*.apk | head -1)
          [ -n "$apk" ] || { echo "::error::kagex-release made no APK"; exit 1; }
          unzip -l "$apk" | grep -E 'assets/data|lib/' | tee -a "$GITHUB_WORKSPACE/results/game.txt"
          unzip -o -q "$apk" 'lib/*' -d "$RUNNER_TEMP/gamelib"
          LC_ALL=C grep -l "Live2D Cubism SDK Core Version" "$RUNNER_TEMP"/gamelib/lib/*/*.so | tee -a "$GITHUB_WORKSPACE/results/game.txt" | grep -q x86_64 \
            || { echo "::error title=No Live2D::the game's APK has no Cubism Core in its engine"; exit 1; }
          echo "GAME_APK=$apk" >> "$GITHUB_ENV"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an emulator
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          # the debug build through its REPL, then the APK kagex-release made from the game's own
          # engine package, which (a release build) has no REPL: started and checked by its log
          script: |
            kirikiri/kagex/.github/platforms/run-logged.sh smoke python3 -B kirikiri/kagex/tools/smoketest.py --target android --apk "$APK" --keep --live2d required; s=$?; cp /tmp/kagex-smoke-*/logcat.txt results/ 2>/dev/null; exit $s
            kirikiri/kagex/.github/platforms/run-logged.sh game-start kirikiri/kagex/.github/platforms/android-start.sh "$GAME_APK" io.github.krkren.kagex.live2d results/game-logcat.txt krkrlive2d scnfile xp3crypt
      # the sample game with Live2D, on a release: the APK kagex-release made from the game's own
      # engine package (an optimized build signed with the debug key, its data in data.xp3),
      # started on the emulator above
      - name: Add the sample game to the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$GAME_APK" "$RUNNER_TEMP/kagex_sample_live2d_android.apk"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/kagex_sample_live2d_android.apk" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_NO_PICTURES: 1
        run: kirikiri/kagex/.github/platforms/publish-results.sh live2d-android "live2d android, run ${{ github.run_id }} (${{ job.status }})"

  ios:
    needs: [scenarios, tool]
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 150
    env:
      KRKRZ_BASE: ${{ github.workspace }}/kirikiri
      PROJECT_DIR: ${{ github.workspace }}/kirikiri/kagex
    steps:
      - uses: actions/checkout@v4
        with:
          path: kirikiri/kagex
          ref: ${{ inputs.release || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: live2d-scenarios
          path: ${{ runner.temp }}/scenarios
      - name: Put the compiled scenarios into the project
        run: |
          mkdir -p results
          echo "${{ github.sha }} on ios, run ${{ github.run_id }}" > results/run.txt
          tar xzf "$RUNNER_TEMP/scenarios/scenarios.tgz" -C kirikiri/kagex && ls kirikiri/kagex/data/scenario/*.scn*
      - name: Clone the engine and krkrz_ios
        run: kirikiri/kagex/.github/platforms/setup.sh krkrz_ios "$KRKRZ_IOS_SHA"
      - name: The Cubism SDK
        env:
          SDK_TOKEN: ${{ secrets.CUBISM_SDK_TOKEN }}
        run: |
          [ -n "$SDK_TOKEN" ] || { echo "::error title=No Cubism SDK::The CUBISM_SDK_TOKEN secret isn't set"; exit 1; }
          git clone -q --depth 1 "https://x-access-token:${SDK_TOKEN}@github.com/krkren/cubism-sdk.git" "$RUNNER_TEMP/cubism-sdk"
          # the clone keeps its URL, token and all, in .git/config: gone before any other step runs
          chmod -R u+w "$RUNNER_TEMP/cubism-sdk/.git"; rm -rf "$RUNNER_TEMP/cubism-sdk/.git"
          got=$(cd "$RUNNER_TEMP/cubism-sdk" && shasum -a 256 "$CUBISM_SDK_ZIP" | cut -d' ' -f1)
          want=$(cut -d' ' -f1 "$RUNNER_TEMP/cubism-sdk/$CUBISM_SDK_ZIP.sha256")
          [ -n "$got" ] && [ "$got" = "$want" ] || { echo "::error title=Cubism SDK::$CUBISM_SDK_ZIP's SHA-256 isn't the one recorded"; exit 1; }
          echo "$CUBISM_SDK_ZIP: SHA-256 as recorded" | tee results/sdk.txt
      - name: Live2D in the engine
        run: |
          kirikiri/kagex/.github/platforms/run-logged.sh kit python3 -B kirikiri/kagex/tools/live2d/build.py \
            --sdk "$RUNNER_TEMP/cubism-sdk/$CUBISM_SDK_ZIP" --work "$RUNNER_TEMP/live2d" --kit "$PROJECT_DIR/ios-config.json"
          cat "$RUNNER_TEMP/live2d/kit.env" >> "$GITHUB_ENV"
      - name: Hiyori
        run: |
          kirikiri/kagex/.github/platforms/run-logged.sh hiyori python3 -B kirikiri/kagex/tools/assets/make_hiyori.py model --accept-license
      - name: Set up vcpkg
        run: |
          git clone -q https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          xcodebuild -version | tee results/xcode.txt
      - name: Build for the Simulator
        run: |
          echo "include(\"$PROJECT_DIR/.github/platforms/monocypher-kit.cmake\")" >> kirikiri/krkrz_ios/CMakeLists.txt
          kirikiri/kagex/.github/platforms/run-logged.sh build make -C kirikiri/krkrz_ios build
          app=$(find "$PROJECT_DIR/build/ios" -name '*.app' -path '*iphonesimulator*' | head -1)
          [ -n "$app" ] || { echo "::error::no .app"; exit 1; }
          echo "APP=$app" >> "$GITHUB_ENV"
          ls "$app" | tee results/app.txt
      - name: Smoke test in the Simulator
        timeout-minutes: 30
        run: |
          dev=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "device $dev" | tee results/simulator.txt
          echo "SIM_DEVICE=$dev" >> "$GITHUB_ENV"
          xcrun simctl boot "$dev" || true
          xcrun simctl bootstatus "$dev" -b > /dev/null
          s=0
          kirikiri/kagex/.github/platforms/run-logged.sh smoke python3 -B kirikiri/kagex/tools/smoketest.py --target ios-sim --app "$APP" --device "$dev" --keep --live2d required || s=$?
          cp "$(ls -td "${TMPDIR:-/tmp}"/kagex-smoke-* | head -1)/simulator.log" results/ 2>/dev/null || true
          exit $s
      # the engine for devices (Release, unsigned: a developer's certificate signs it), as
      # platforms.yml builds it for kagex-release's engine package: here with the Cubism Core
      # for devices
      - name: Build for devices, unsigned
        run: |
          kirikiri/kagex/.github/platforms/run-logged.sh device-configure make -C kirikiri/krkrz_ios dist-configure
          kirikiri/kagex/.github/platforms/run-logged.sh device-build xcodebuild -project "$PROJECT_DIR/build/ios/dist/krkrz_ios.xcodeproj" \
            -target krkrz -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          dapp=$(find "$PROJECT_DIR/build/ios/dist" -name '*.app' -path '*iphoneos*' | head -1)
          [ -n "$dapp" ] || { echo "::error::no device .app"; exit 1; }
          LC_ALL=C grep -rl "Live2D Cubism SDK Core Version" "$dapp" | tee results/device.txt | grep -q . \
            || { echo "::error title=No Live2D::the engine for devices has no Cubism Core"; exit 1; }
          ditto -c -k --keepParent "$dapp" "$RUNNER_TEMP/ios-device.zip"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/ios-simulator.zip"
      - uses: actions/download-artifact@v4
        with:
          name: live2d-kagex-release-macos
          path: ${{ runner.temp }}/tool
      # A game's own engine package, as tools/live2d/README.md has a developer make it: these two
      # apps through ios-engine.py (which refuses the Cubism Core without --with-cubism-core)
      # into engines/ next to data/, where kagex-release finds it, then the sample built from it
      # for the Simulator (smoke-tested below: its REPL is a launch option) and for devices
      # (signed ad hoc with a stand-in profile, as tools/release/test/smoke.py does)
      - name: A game's own engine package
        run: |
          version=$(python3 -c "import json; print(json.load(open('$PROJECT_DIR/linux-config.json'))['version'])")
          if python3 -I kirikiri/kagex/tools/release/scripts/ios-engine.py --device "$RUNNER_TEMP/ios-device.zip" --simulator "$RUNNER_TEMP/ios-simulator.zip" \
              "$RUNNER_TEMP/refused.zip" --version "$version" > results/engine-refused.txt 2>&1; then
            echo "::error title=Cubism Core::ios-engine.py made an engine package holding the Cubism Core without --with-cubism-core"
            exit 1
          fi
          grep -q "Cubism Core" results/engine-refused.txt || { cat results/engine-refused.txt; exit 1; }
          mkdir -p "$PROJECT_DIR/engines"
          python3 -I kirikiri/kagex/tools/release/scripts/ios-engine.py --device "$RUNNER_TEMP/ios-device.zip" --simulator "$RUNNER_TEMP/ios-simulator.zip" \
            "$PROJECT_DIR/engines/kagex_engine_ios.zip" --version "$version" --with-cubism-core \
            > results/engine-package.txt 2>&1 || { cat results/engine-package.txt; exit 1; }
          cat results/engine-package.txt
          tool="$RUNNER_TEMP/tool/kagex-release"
          chmod +x "$tool"
          "$tool" --version | tee results/game.txt
          cd "$PROJECT_DIR"
          "$tool" --cli init . >> "$GITHUB_WORKSPACE/results/game.txt"
          for target in simulator device; do
            python3 - "$target" <<'PY'
          import json, plistlib, sys
          s = json.load(open("release.json", encoding="utf-8"))
          for p in s["platforms"]:
              s["platforms"][p]["enabled"] = p == "ios"
          s["output"]["check"] = False
          open("test.mobileprovision", "wb").write(plistlib.dumps({"Name": "kagex live2d test", "Entitlements": {
              "application-identifier": "ABCDE12345.io.github.krkren.kagex.live2d", "get-task-allow": True}}))
          s["platforms"]["ios"].update({"bundleId": "io.github.krkren.kagex.live2d", "buildNumber": 0, "identity": "-",
                                        "profile": "test.mobileprovision", "data": "xp3", "target": sys.argv[1]})
          json.dump(s, open("release.json", "w", encoding="utf-8"), indent=2)
          PY
            "$tool" --cli check release.json >> "$GITHUB_WORKSPACE/results/game.txt" 2>&1 || true
            .github/platforms/run-logged.sh "game-build-$target" "$tool" --cli build release.json
          done
          sim=$(ls "$PWD"/release/*-ios-simulator.zip | head -1)
          ipa=$(ls "$PWD"/release/*.ipa | head -1)
          [ -n "$sim" ] && [ -n "$ipa" ] || { echo "::error::kagex-release made no Simulator app or .ipa"; exit 1; }
          mkdir -p "$RUNNER_TEMP/game" "$RUNNER_TEMP/ipa"
          ditto -x -k "$sim" "$RUNNER_TEMP/game"
          ditto -x -k "$ipa" "$RUNNER_TEMP/ipa"
          gapp=$(ls -d "$RUNNER_TEMP"/game/*.app | head -1)
          dapp=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -1)
          for a in "$gapp" "$dapp"; do
            ls "$a" | tee -a "$GITHUB_WORKSPACE/results/game.txt"
            test -f "$a/data.xp3" || { echo "::error::no data.xp3 in $a"; exit 1; }
            LC_ALL=C grep -rl "Live2D Cubism SDK Core Version" "$a" | tee -a "$GITHUB_WORKSPACE/results/game.txt" | grep -q . \
              || { echo "::error title=No Live2D::$(basename "$a") has no Cubism Core"; exit 1; }
            codesign --verify --deep --strict "$a" 2>&1 | tee -a "$GITHUB_WORKSPACE/results/game.txt"
            [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error::the signature of $a doesn't verify"; exit 1; }
          done
          echo "GAME_APP=$gapp" >> "$GITHUB_ENV"
          echo "GAME_SIM_ZIP=$sim" >> "$GITHUB_ENV"
      - name: Smoke test of the game in the Simulator
        timeout-minutes: 30
        run: |
          s=0
          kirikiri/kagex/.github/platforms/run-logged.sh game-smoke python3 -B kirikiri/kagex/tools/smoketest.py --target ios-sim --app "$GAME_APP" \
            --bundle-id io.github.krkren.kagex.live2d --device "$SIM_DEVICE" --keep --live2d required || s=$?
          cp "$(ls -td "${TMPDIR:-/tmp}"/kagex-smoke-* | head -1)/simulator.log" results/game-simulator.log 2>/dev/null || true
          exit $s
      # the sample game with Live2D, on a release: the Simulator app kagex-release made from the
      # game's own engine package (its data in data.xp3), smoke-tested above
      - name: The Simulator package as the release's
        if: inputs.release != ''
        run: cp "$GAME_SIM_ZIP" "$RUNNER_TEMP/kagex_sample_live2d_ios_simulator.zip"
      # Live2D's licence asks a game to show its players these terms. kagex-release puts its
      # extraFiles beside the program on the desktops only, and an APK or a .app bundle holds no
      # file like that, so they come along inside the package as README.md (at its root when the
      # package holds a .app, beside the program when it is loose files)
      - name: README.md in the sample package
        if: inputs.release != ''
        env:
          PKG: "${{ runner.temp }}/kagex_sample_live2d_ios_simulator.zip"
        run: |
          test -f kirikiri/kagex/tools/live2d/LIVE2D-NOTICE.txt || { echo "::error::tools/live2d/LIVE2D-NOTICE.txt is missing"; exit 1; }
          python3 - "$PKG" <<'PY'
          import os, sys, zipfile
          pkg = sys.argv[1]
          with zipfile.ZipFile(pkg) as z:
              names = z.namelist()
              notice = [n for n in names if n.split("/")[-1] == "LIVE2D-NOTICE.txt"]
              folder = os.path.dirname(notice[0]) if notice else ""
              if any(n.split("/")[-1] == "README.md" for n in names):
                  sys.exit("README.md is already in " + pkg)
          with zipfile.ZipFile(pkg, "a") as z:
              z.write("kirikiri/kagex/tools/live2d/LIVE2D-NOTICE.txt", (folder + "/" if folder else "") + "README.md")
          print("the terms for the players, as README.md in %s (%s)" % (pkg, folder or "the package root"))
          PY
      - name: Add the sample game to the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/kagex_sample_live2d_ios_simulator.zip" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_NO_PICTURES: 1
        run: kirikiri/kagex/.github/platforms/publish-results.sh live2d-ios "live2d ios, run ${{ github.run_id }} (${{ job.status }})"
