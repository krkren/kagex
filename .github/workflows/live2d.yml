# A probe (branch live2d/xcode-probe only): which part of the Live2D driver's build makes CMake's
# Xcode generator stop with "duplicate object ids not allowed" for iOS. Configures only.
name: Live2D
on:
  push:
    branches: ['live2d/xcode-probe']
permissions:
  contents: write
env:
  CUBISM_SDK_ZIP: CubismSdkForNative-5-r.5.zip
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Sources
        env:
          SDK_TOKEN: ${{ secrets.CUBISM_SDK_TOKEN }}
        run: |
          mkdir -p results
          echo "${{ github.sha }} probe, run ${{ github.run_id }}" > results/run.txt
          git clone -q --depth 1 "https://x-access-token:${SDK_TOKEN}@github.com/krkren/cubism-sdk.git" "$RUNNER_TEMP/cubism-sdk"
          echo '{"cmake": {"pluginFolders": [], "plugins": []}}' > "$RUNNER_TEMP/cfg.json"
          python3 -B tools/live2d/build.py --sdk "$RUNNER_TEMP/cubism-sdk/$CUBISM_SDK_ZIP" --work "$RUNNER_TEMP/live2d" --kit "$RUNNER_TEMP/cfg.json" > results/kit.log 2>&1
          cat "$RUNNER_TEMP/live2d/kit.env" >> "$GITHUB_ENV"
          { cmake --version; xcodebuild -version; } > results/tools.txt
      - name: Configure for iOS with Xcode, part by part
        run: |
          W="$RUNNER_TEMP/live2d/src"
          for v in full no_ktx no_minizip no_both; do
            unset PROBE_NO_KTX PROBE_NO_MINIZIP
            case $v in no_ktx) export PROBE_NO_KTX=1;; no_minizip) export PROBE_NO_MINIZIP=1;; no_both) export PROBE_NO_KTX=1 PROBE_NO_MINIZIP=1;; esac
            cmake -S "$W/krkrlive2d" -B "$RUNNER_TEMP/b-$v" -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
              -DCMAKE_OSX_ARCHITECTURES=arm64 -DVCPKG_TARGET_TRIPLET=arm64-ios-simulator-krkrz -DKRKRZ_VARIANT=SDL \
              -DCMAKE_CXX_STANDARD=17 -DTPSTUB_DIR="$W/tp_stub" -DNCBIND_DIR="$W/ncbind" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              > "results/$v.log" 2>&1
            echo "$v: exit $?, $(grep -c 'duplicate object ids' "results/$v.log") duplicate-id errors" | tee -a results/summary.txt
          done
          # KTX-Software alone, as the driver builds it
          cmake -S "$W/live2d/external/KTX-Software" -B "$RUNNER_TEMP/b-ktx" -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DKTX_FEATURE_TESTS=OFF -DKTX_FEATURE_TOOLS=OFF -DLIBKTX_VERSION_READ_ONLY=ON \
            -DLIBKTX_VERSION_FULL=OFF -DBUILD_SHARED_LIBS=OFF -DKTX_INSTALL=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 > results/ktx_alone.log 2>&1
          echo "ktx alone: exit $?, $(grep -c 'duplicate object ids' results/ktx_alone.log) duplicate-id errors" | tee -a results/summary.txt
          # which files the duplicates might be: sources listed twice in a target
          for b in full; do
            find "$RUNNER_TEMP/b-$b" -name project.pbxproj | head -3 >> results/summary.txt
          done
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_NO_PICTURES: 1
        run: .github/platforms/publish-results.sh live2d-probe "live2d xcode probe, run ${{ github.run_id }}"
