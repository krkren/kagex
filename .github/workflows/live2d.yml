# Builds the krkrlive2d plugin (Live2D characters, doc/world.txt "Live2D Characters") with
# Live2D's Cubism SDK for Native on Windows, Linux and macOS (tools/live2d/build.py), and runs the
# sample's smoke test with Live2D required on each platform's engine package from the newest
# release, with Hiyori fetched from Live2D's GitHub (tools/assets/make_hiyori.py). Android and
# iOS link every plugin into the engine, so there the kit builds the engine with the plugin
# (build.py --kit), as platforms.yml builds the sample's apps, and the smoke test runs on an
# emulator and in the Simulator.
#
# The SDK is Live2D's, and its licence keeps it private: it comes from the private repository
# krkren/cubism-sdk through the CUBISM_SDK_TOKEN secret (a fine-grained token that can only read
# that repository's contents). Neither the SDK, nor the plugin or the engines built with it, nor
# Hiyori leaves the runner: no artifacts (but the compiled scenarios, which hold neither), and the
# results branches (ci/platform-results-live2d-<os>) hold logs only, no pictures.
name: Live2D

on:
  push:
    branches: ['feature/live2d', 'live2d/**', main]
    paths:
      - 'template/system/GFX_Live2D.tjs'
      - 'template/system/KAGEnvCharacter*.tjs'
      - 'template/system/world.tjs'
      - 'data/main/envinit.tjs'
      - 'data/scenario/anim.ks'
      - 'tools/live2d/**'
      - 'tools/live2d-standin.tjs'
      - 'tools/smoketest.py'
      - 'tools/assets/make_hiyori.py'
      - 'app-config.json'
      - 'ios-config.json'
      - '.github/workflows/live2d.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # the SDK in krkren/cubism-sdk (with its .sha256 beside it)
  CUBISM_SDK_ZIP: CubismSdkForNative-5-r.5.zip
  # Android and iOS: the engine, the kits and kagex's plugins, as platforms.yml pins them
  ENGINE_SHA: 21d20e9745e13c9ffe68ae2eb012548afe73aaa8
  KRKRZ_ANDROID_SHA: eff2b17b5df37af29681cc4872da6b5b0bd94d63
  KRKRZ_IOS_SHA: 003abad6e7dc14ef597be566c8b3c4606fb9b7c1
  XP3CRYPT_SHA: 08ad5f7f8737f2ebea137acefa03b9aa8a41e380
  SCNFILE_SHA: e39c354233ffea9ab850f23ac2c7ad4562ac4ca7
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  live2d:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the engines are x64 on Windows and arm64 on macOS
          # Linux in the Steam Runtime's SDK (glibc 2.31), as a game's release would build it
          - { os: ubuntu-24.04, name: linux, arch: '', video: offscreen, buildopts: --steamrt }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          mkdir -p results
          # never empty, so the results branch is pushed whichever step fails
          echo "${{ github.sha }} on ${{ matrix.os }}, run ${{ github.run_id }}" > results/run.txt
          PY=python3; [ "$RUNNER_OS" = Windows ] && PY=python
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "WORK=$(cd "$RUNNER_TEMP" && (pwd -W 2>/dev/null || pwd))" >> "$GITHUB_ENV"
      - name: The Cubism SDK
        env:
          SDK_TOKEN: ${{ secrets.CUBISM_SDK_TOKEN }}
        run: |
          if [ -z "$SDK_TOKEN" ]; then
            echo "::error title=No Cubism SDK::The CUBISM_SDK_TOKEN secret (read access to krkren/cubism-sdk) isn't set"
            exit 1
          fi
          git clone -q --depth 1 "https://x-access-token:${SDK_TOKEN}@github.com/krkren/cubism-sdk.git" "$WORK/cubism-sdk"
          $PY - "$WORK/cubism-sdk/$CUBISM_SDK_ZIP" <<'PY' | tee results/sdk.txt
          import hashlib, sys
          data = open(sys.argv[1], "rb").read()
          want = open(sys.argv[1] + ".sha256").read().split()[0]
          got = hashlib.sha256(data).hexdigest()
          print("%s: %d bytes, SHA-256 %s" % (sys.argv[1].replace("\\", "/").split("/")[-1], len(data), got))
          sys.exit(0 if got == want else "the SDK's SHA-256 isn't the one recorded beside it")
          PY
      - name: Libraries for the test run
        if: runner.os == 'Linux'
        run: |
          # the engine draws with OpenGL ES through EGL (Mesa), headless with SDL's offscreen driver
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libgomp1 fontconfig > results/apt.log 2>&1
      - name: OpenGL ES for the test run
        # the Windows VM has no GPU driver: the engine gets GLES through Edge's ANGLE (in PATH,
        # not in the packages)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $angle = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeCore", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application" -Recurse -Filter libGLESv2.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($angle) { New-Item -ItemType Directory -Force angle | Out-Null; foreach ($n in 'libEGL.dll', 'libGLESv2.dll', 'd3dcompiler_47.dll') { $f = Join-Path $angle.DirectoryName $n; if (Test-Path $f) { Copy-Item $f angle\ } }; "$PWD\angle" >> $env:GITHUB_PATH; Get-ChildItem angle }
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Build the plugin
        run: |
          { cmake --version | head -1; ninja --version; } | tee results/toolchain.txt
          arch=(); [ -n "${{ matrix.arch }}" ] && arch=(--arch "${{ matrix.arch }}")
          .github/platforms/run-logged.sh build $PY -B tools/live2d/build.py --sdk "$WORK/cubism-sdk/$CUBISM_SDK_ZIP" \
            --work "$WORK/live2d" --out "$WORK/live2d-plugin" "${arch[@]}" ${{ matrix.buildopts }}
          ls -l "$WORK/live2d-plugin" | tee results/plugin.txt
          case "$RUNNER_OS" in
            Linux)
              nm -D --defined-only "$WORK/live2d-plugin/libkrkrlive2d.so" | grep -v ' _' >> results/plugin.txt
              # built in the Steam Runtime: it needs no newer glibc than 2.31
              glibc=$(objdump -T "$WORK/live2d-plugin/libkrkrlive2d.so" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
              echo "needs $glibc" | tee -a results/plugin.txt
              printf '%s\n' "$glibc" "GLIBC_2.31" | sort -CV || { echo "::error title=glibc::the plugin needs $glibc, newer than the Steam Runtime's 2.31"; exit 1; } ;;
            macOS) otool -L "$WORK/live2d-plugin/libkrkrlive2d.dylib" >> results/plugin.txt; lipo -info "$WORK/live2d-plugin/libkrkrlive2d.dylib" >> results/plugin.txt ;;
          esac
      - name: The engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name == "kagex_engine_linux.zip"))][0].tag_name')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error title=No engine::No release has the engine packages"
            exit 1
          fi
          echo "engine package kagex_engine_${{ matrix.name }}.zip from $tag" | tee results/engine.txt
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "kagex_engine_${{ matrix.name }}.zip" --dir "$WORK"
          mkdir -p "$WORK/engine"
          cd "$WORK/engine"
          # unzip keeps the executables' modes (Linux, macOS); Git Bash on Windows has none
          if [ "$RUNNER_OS" = Windows ]; then $PY -m zipfile -e "../kagex_engine_${{ matrix.name }}.zip" .; else unzip -q "../kagex_engine_${{ matrix.name }}.zip"; fi
          case "$RUNNER_OS" in
            Windows)
              cp "$WORK/live2d-plugin/krkrlive2d.dll" plugin/
              cp "$GITHUB_WORKSPACE/krkrz.cf" .
              exe="$WORK/engine/krkrz.exe" ;;
            Linux)
              cp "$WORK/live2d-plugin/libkrkrlive2d.so" plugin/
              cp "$GITHUB_WORKSPACE/krkrz.cf" .
              chmod +x krkrz
              exe="$WORK/engine/krkrz" ;;
            macOS)
              # the plugins sit beside the executable; the package's app is unsigned, and an
              # unsigned app doesn't start: sign it ad hoc
              cp "$WORK/live2d-plugin/libkrkrlive2d.dylib" KAGEX.app/Contents/MacOS/
              cp "$GITHUB_WORKSPACE/krkrz.cf" KAGEX.app/Contents/MacOS/
              codesign --force --deep --sign - KAGEX.app
              exe="$WORK/engine/KAGEX.app/Contents/MacOS/krkrz" ;;
          esac
          echo "ENGINE=$exe" >> "$GITHUB_ENV"
      - name: Hiyori
        run: .github/platforms/run-logged.sh hiyori $PY -B tools/assets/make_hiyori.py model --accept-license
      - name: Smoke test
        timeout-minutes: 30
        env:
          SDL_VIDEO_DRIVER: ${{ matrix.video }}
          SDL_AUDIO_DRIVER: dummy
          # the log in UTF-8 on Windows too (its console's code page has no Japanese)
          PYTHONUTF8: 1
        run: .github/platforms/run-logged.sh smoke $PY -B tools/smoketest.py --engine "$ENGINE" --only sample --keep --live2d required
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # Hiyori is on the screen: no screenshots on a public branch
          RESULTS_NO_PICTURES: 1
        run: .github/platforms/publish-results.sh "live2d-${{ matrix.name }}" "live2d ${{ matrix.name }}, run ${{ github.run_id }} (${{ job.status }})"

