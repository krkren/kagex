# Builds kagex for the platforms that Wamsoft's kits cover, from the configs at the root of
# this repository (linux-config.json, web-config.json, app-config.json, ios-config.json),
# plus macOS from krkrz_dev's own presets. Each job smoke-tests what it built where it can
# and keeps its logs on branch ci/platform-results-<job>.
#
# Runs on pushes to platforms/** branches, by hand, and from the release workflow
# (workflow_call, with the release commit as `ref`); each job keeps what it built as an
# artifact (kagex-linux, kagex-web, kagex-android, kagex-ios-simulator, kagex-macos), and the
# Android and iOS jobs also kagex-release's engine packages for those (kagex-engine-android, a
# Gradle project with the engine prebuilt; kagex-engine-ios, unsigned device and Simulator apps).
# A pushed commit message with "[platforms: linux web]" builds only those.
#
# A job whose engine an earlier release built already doesn't compile it (since 0.14.0):
# platform-engine.py works out a key of what goes into the engine (the pinned commits, the
# config without its version, the files the build reads, this workflow) and looks for a release
# whose note (kagex-engine-build.json, "platforms") has it; then the job takes that release's
# engine package (kagex_engine_<platform>.zip, the engine without the game) and adds this
# commit's game the way the kit does after its build: the Linux kit's stage and package, the web
# kit's staging, Gradle on the Android package's project (the debug APK for the smoke test and
# the release-debug one), the game and version put into the iOS Simulator app and the macOS app.
# The packages and their smoke tests are the same either way. Each job uploads its key
# (kagex-engine-key-<platform>), which the release's publish writes into the note. "[rebuild]" in
# a pushed message (or the rebuild input) builds every engine; "[reuse: <tag>]" (or reuse_from,
# never in a release) takes that release's engine packages whatever their keys, to test this.
name: Platform builds

on:
  push:
    branches: ['platforms/**']
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        default: "linux web android ios macos"
      rebuild:
        description: "Build every engine, even when a release has it"
        type: boolean
        default: false
      reuse_from:
        description: "Test the reuse steps with this release's engine packages, whatever their keys"
        default: ""
      hunt:
        description: "Android: instead of the smoke test's steps, play <script>:<from label>:<to label>:<rounds> until it hangs, keeping the threads' stacks (smoketest.py --hunt)"
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "The kagex commit to build"
        type: string
        required: true
      platforms:
        type: string
        default: "linux web android ios macos"
      rebuild:
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  # the engine the 0.1.x packages were built from
  ENGINE_SHA: 21d20e9745e13c9ffe68ae2eb012548afe73aaa8
  # the platform kits, at the commits this was set up with
  KRKRZ_LINUX_SHA: 03605924f952f848abe9d5f85874846b9aa3f940
  KRKRZ_WEB_SHA: 2fe46168acebc9ecf093d95e630a98f50a17efba
  KRKRZ_ANDROID_SHA: eff2b17b5df37af29681cc4872da6b5b0bd94d63
  KRKRZ_IOS_SHA: 003abad6e7dc14ef597be566c8b3c4606fb9b7c1
  STEAMDEV_SHA: e39d1d9dddc741a1c343dc6c653dc303515a0204
  # kagex's own plugins (setup.sh clones them next to krkrz_dev): xp3crypt, built into every
  # engine, decrypts data.xp3; scnfile reads compiled scenarios. kagex-release writes each game's
  # keys into them
  XP3CRYPT_SHA: 08ad5f7f8737f2ebea137acefa03b9aa8a41e380
  SCNFILE_SHA: e39c354233ffea9ab850f23ac2c7ad4562ac4ca7
  # CMake 4 (the macOS runners) refuses the old cmake_minimum_required of some engine
  # dependencies (krkrz_vorbis)
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
      rebuild: ${{ steps.pick.outputs.rebuild }}
      reuse_from: ${{ steps.pick.outputs.reuse_from }}
    steps:
      - id: pick
        env:
          INPUT: ${{ inputs.platforms }}
          CALLED: ${{ inputs.ref }}
          MESSAGE: ${{ github.event.head_commit.message }}
          REBUILD_INPUT: ${{ inputs.rebuild }}
          REUSE_INPUT: ${{ inputs.reuse_from }}
        run: |
          list="linux web android ios macos"
          [ -n "$INPUT" ] && list="$INPUT"
          rebuild=false
          [ "$REBUILD_INPUT" = "true" ] && rebuild=true
          reuse="$REUSE_INPUT"
          # a called run gets the caller's push event: its message is the release branch's
          m=""
          if [ -z "$CALLED" ]; then
            m=$(printf '%s' "$MESSAGE" | grep -oE '\[platforms: [a-z ]+\]' | head -1 | sed -E 's/\[platforms: (.*)\]/\1/')
            printf '%s' "$MESSAGE" | grep -qF '[rebuild]' && rebuild=true
            r=$(printf '%s' "$MESSAGE" | grep -oE '\[reuse: [0-9A-Za-z._-]+\]' | head -1 | sed -E 's/\[reuse: (.*)\]/\1/')
            [ -n "$r" ] && reuse="$r"
          fi
          [ -n "$m" ] && list="$m"
          echo "list= $list " >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "reuse_from=$reuse" >> "$GITHUB_OUTPUT"
          echo "building: $list (rebuild every engine: $rebuild${reuse:+; the engines of release $reuse})"

  # The sample's scenarios compiled (compile-scenarios.sh), for every platform job to put into the
  # project before it packages it: the web, Android and iOS packages can't compile them as they
  # play, so without them going back, the Replay pictures and Search found nothing there
  scenarios:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install the libraries the engine loads
        run: |
          sudo timeout 600 apt-get install -y -q --no-install-recommends -o DPkg::Lock::Timeout=300 \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libgomp1 fontconfig > /dev/null
      - name: Compile the scenarios
        run: .github/platforms/compile-scenarios.sh . "$RUNNER_TEMP/scenarios.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-scenarios
          path: ${{ runner.temp }}/scenarios.tgz
          if-no-files-found: error
      - name: Stop the whole run on a failure
        if: failure() && github.workflow == 'Release packages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true

  linux:
    needs: [select, scenarios]
    if: contains(needs.select.outputs.list, ' linux ')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KRKRZ_BASE: ${{ github.workspace }}/kirikiri
      PROJECT_DIR: ${{ github.workspace }}/kirikiri/kagex
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: kirikiri/kagex
      - uses: actions/download-artifact@v4
        with:
          name: kagex-scenarios
          path: ${{ runner.temp }}/scenarios
      - name: Put the compiled scenarios into the project
        run: tar xzf "$RUNNER_TEMP/scenarios/scenarios.tgz" -C kirikiri/kagex && ls kirikiri/kagex/data/scenario/*.scn*
      - name: An earlier release's build of this engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ needs.select.outputs.rebuild }}
          REUSE_FROM: ${{ needs.select.outputs.reuse_from }}
          ENGINE_KEY_DIR: ${{ runner.temp }}/engine-key
          ENGINE_DIR: ${{ runner.temp }}/engine
        run: |
          mkdir -p results
          python3 kirikiri/kagex/.github/platforms/platform-engine.py find steam "$GITHUB_OUTPUT" | tee results/engine.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-engine-key-steam
          path: ${{ runner.temp }}/engine-key/steam.key
          if-no-files-found: error
      # the kit's stage reads krkrz_dev's core folder and the kit's tools: cloned either way
      - name: Clone the engine and krkrz_linux
        run: kirikiri/kagex/.github/platforms/setup.sh krkrz_linux "$KRKRZ_LINUX_SHA"
      - name: Build the Steam Linux Runtime (sniper) image
        if: steps.engine.outputs.reuse == ''
        run: |
          git clone -q https://github.com/wamsoft/steamdev.git steamdev
          git -C steamdev checkout -q "$STEAMDEV_SHA"
          kirikiri/kagex/.github/platforms/run-logged.sh image bash steamdev/deckbuild/deckbuild.sh image
      - name: Build and package
        env:
          REUSE: ${{ steps.engine.outputs.reuse }}
        run: |
          if [ -n "$REUSE" ]; then
            # the engine package is the kit's install folder (symlinks followed): the kit's stage
            # puts it, the .cf/.desktop/icon and the game into the package, as after its build
            install="$PROJECT_DIR/build/linux/install"
            rm -rf "$install" && mkdir -p "$install"
            unzip -q "$RUNNER_TEMP/engine/kagex_engine_steam.zip" -d "$install"
            rm -f "$install/engine.json"
            kirikiri/kagex/.github/platforms/run-logged.sh build make -C kirikiri/krkrz_linux stage package
          else
            kirikiri/kagex/.github/platforms/run-logged.sh build make -C kirikiri/krkrz_linux all
          fi
      - name: Every plugin loads
        working-directory: kirikiri/kagex/build/linux/package/krkrz
        run: |
          ls -la . plugin | tee "$GITHUB_WORKSPACE/results/package.txt"
          python3 - <<'PY' | tee "$GITHUB_WORKSPACE/results/plugins.txt"
          import ctypes, glob, os, sys
          bad = []
          for so in sorted(glob.glob("plugin/*.so")):
              try:
                  ctypes.CDLL(os.path.abspath(so), mode=os.RTLD_NOW | os.RTLD_LOCAL)
                  print("ok  ", so)
              except OSError as e:
                  print("FAIL", so, e); bad.append(so)
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-linux
          path: kirikiri/kagex/build/linux/dist/*.tar.gz
          if-no-files-found: error
      - name: Smoke test
        timeout-minutes: 20
        working-directory: kirikiri/kagex/build/linux/package/krkrz
        run: |
          # the engine draws with OpenGL ES through EGL, which the runner image lacks (Mesa's
          # software renderer stands in for a GPU)
          sudo timeout 600 apt-get install -y -q --no-install-recommends -o DPkg::Lock::Timeout=300 \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri > "$GITHUB_WORKSPACE/results/apt.log" 2>&1
          $GITHUB_WORKSPACE/kirikiri/kagex/.github/platforms/run-logged.sh smoke python3 -B "$PROJECT_DIR/tools/smoketest.py" --engine ./krkrz --effekseer required --alphamovie required --three required --vector required --zip required --clip required --encryption required
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: kirikiri/kagex/.github/platforms/publish-results.sh linux "linux, run ${{ github.run_id }} (${{ job.status }})"
      - name: Stop the whole run on a failure
        # a failed job cancels the others (iOS and Android take the longest), so a
        # release that can't publish stops at once
        if: failure() && github.workflow == 'Release packages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  web:
    needs: [select, scenarios]
    if: contains(needs.select.outputs.list, ' web ')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KRKRZ_BASE: ${{ github.workspace }}/kirikiri
      PROJECT_DIR: ${{ github.workspace }}/kirikiri/kagex
      EMSDK: ${{ github.workspace }}/emsdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: kirikiri/kagex
      - uses: actions/download-artifact@v4
        with:
          name: kagex-scenarios
          path: ${{ runner.temp }}/scenarios
      - name: Put the compiled scenarios into the project
        run: tar xzf "$RUNNER_TEMP/scenarios/scenarios.tgz" -C kirikiri/kagex && ls kirikiri/kagex/data/scenario/*.scn*
      - name: An earlier release's build of this engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ needs.select.outputs.rebuild }}
          REUSE_FROM: ${{ needs.select.outputs.reuse_from }}
          ENGINE_KEY_DIR: ${{ runner.temp }}/engine-key
          ENGINE_DIR: ${{ runner.temp }}/engine
        run: |
          mkdir -p results
          python3 kirikiri/kagex/.github/platforms/platform-engine.py find web "$GITHUB_OUTPUT" | tee results/engine.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-engine-key-web
          path: ${{ runner.temp }}/engine-key/web.key
          if-no-files-found: error
      # the kit's staging and its patch, and krkrz_dev's resource folder: needed either way
      - name: Clone the engine and krkrz_web
        run: kirikiri/kagex/.github/platforms/setup.sh krkrz_web "$KRKRZ_WEB_SHA"
      - name: Patch the web kit (the demo ships as one data.xp3)
        # delivery:"xp3" (stage_web) + the archive-root project path (pre.js): see the patch
        # header. applied on the pinned kit commit; recheck it when KRKRZ_WEB_SHA moves.
        # the patch path is absolute: git -C resolves its file argument from the kit dir
        run: git -C kirikiri/krkrz_web apply "$GITHUB_WORKSPACE/kirikiri/kagex/tools/live2d/web/kit-web-xp3.patch"
      - name: Set up emsdk and vcpkg
        if: steps.engine.outputs.reuse == ''
        run: |
          git clone -q https://github.com/emscripten-core/emsdk.git "$EMSDK"
          kirikiri/kagex/.github/platforms/run-logged.sh emsdk bash -c "cd '$EMSDK' && ./emsdk install latest && ./emsdk activate latest"
          git clone -q https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: The Cubism Core and the Live2D sources
        if: steps.engine.outputs.reuse == ''
        env:
          SDK_TOKEN: ${{ secrets.CUBISM_SDK_TOKEN }}
        run: |
          [ -n "$SDK_TOKEN" ] || { echo "::error title=No Cubism SDK::The CUBISM_SDK_TOKEN secret isn't set"; exit 1; }
          git clone -q --depth 1 "https://x-access-token:${SDK_TOKEN}@github.com/krkren/cubism-sdk" "$RUNNER_TEMP/cubism-sdk"
          chmod -R u+w "$RUNNER_TEMP/cubism-sdk/.git" && rm -rf "$RUNNER_TEMP/cubism-sdk/.git"
          # the native SDK's zip: its Core headers (and the version gate) go to the plugin's CMake;
          # the Web SDK's zip holds the Core's own wasm, as the script the page runs before the engine
          python3 - <<PY | tee results/sdk.txt
          import hashlib
          data = open("$RUNNER_TEMP/cubism-sdk/CubismSdkForNative-5-r.5.zip", "rb").read()
          got = hashlib.sha256(data).hexdigest()
          print("CubismSdkForNative-5-r.5.zip: SHA-256 %s" % got)
          assert got == open("$RUNNER_TEMP/cubism-sdk/CubismSdkForNative-5-r.5.zip.sha256").read().split()[0]
          PY
          kirikiri/kagex/.github/platforms/run-logged.sh live2d python3 -B kirikiri/kagex/tools/live2d/build.py --web \
            --sdk "$RUNNER_TEMP/cubism-sdk/CubismSdkForNative-5-r.5.zip" \
            --web-sdk "$RUNNER_TEMP/cubism-sdk/CubismSdkForWeb-5-r.5.zip"
          # the engine build: the plugin (driver/CMakeLists.txt) and its sources (krkrz_web's
          # live2d-web-kit.cmake include_directories) read these
          echo "CUBISM_SDK_CORE=$GITHUB_WORKSPACE/kirikiri/kagex/tools/live2d/build/sdk/CubismSdkForNative-5-r.5/Core" >> "$GITHUB_ENV"
          echo "LIVE2DLIB_FOLDER=$GITHUB_WORKSPACE/kirikiri/kagex/tools/live2d/driver" >> "$GITHUB_ENV"
          echo "LIVE2D_DRIVER_SOURCE=$GITHUB_WORKSPACE/kirikiri/kagex/tools/live2d/build/src/live2d" >> "$GITHUB_ENV"
          rm -rf "$RUNNER_TEMP/cubism-sdk"   # the private zips, after their extracts above
      # a reused engine has the plugin already: the sample's site needs only the Web Core, which
      # web-static-host.py puts beside the page (no engine package carries it)
      - name: The Cubism Core for the site
        if: steps.engine.outputs.reuse != ''
        env:
          SDK_TOKEN: ${{ secrets.CUBISM_SDK_TOKEN }}
        run: |
          [ -n "$SDK_TOKEN" ] || { echo "::error title=No Cubism SDK::The CUBISM_SDK_TOKEN secret isn't set"; exit 1; }
          git clone -q --depth 1 "https://x-access-token:${SDK_TOKEN}@github.com/krkren/cubism-sdk" "$RUNNER_TEMP/cubism-sdk"
          chmod -R u+w "$RUNNER_TEMP/cubism-sdk/.git" && rm -rf "$RUNNER_TEMP/cubism-sdk/.git"
          python3 - "$RUNNER_TEMP/cubism-sdk/CubismSdkForWeb-5-r.5.zip" <<'PY' | tee results/live2d.log
          import sys
          sys.path.insert(0, "kirikiri/kagex/tools/live2d")
          import build
          sys.exit(build.web_setup("kirikiri/kagex/tools/live2d/build", None, sys.argv[1]))
          PY
          rm -rf "$RUNNER_TEMP/cubism-sdk"   # the private zips, after the extract above
      - name: Hiyori's model, as the other jobs' does
        run: kirikiri/kagex/.github/platforms/run-logged.sh hiyori python3 -B kirikiri/kagex/tools/assets/make_hiyori.py model --accept-license
      - name: kagex's plugins in the shared binary
        if: steps.engine.outputs.reuse == ''
        run: python3 kirikiri/kagex/.github/platforms/web-plugins.py kirikiri/krkrz_web/CMakeLists.txt | tee results/web-plugins.txt
      - name: Build the shared binary
        env:
          REUSE: ${{ steps.engine.outputs.reuse }}
        run: |
          if [ -n "$REUSE" ]; then
            # the engine package's shared binary where the kit's build leaves it, for stage_web.py;
            # its page, as kagex's staging left it, stands in for krkrz.html (staging below and
            # web-static-host.py set it up again for this build)
            out=kirikiri/krkrz_web/build/wasm32-emscripten/Release/krkrz
            mkdir -p "$out" "$RUNNER_TEMP/engine/web"
            unzip -q -o "$RUNNER_TEMP/engine/kagex_engine_web.zip" krkrz.js krkrz.wasm krkrz.data index.html -d "$RUNNER_TEMP/engine/web"
            cp "$RUNNER_TEMP/engine/web/krkrz.js" "$RUNNER_TEMP/engine/web/krkrz.wasm" "$RUNNER_TEMP/engine/web/krkrz.data" "$out/"
            cp "$RUNNER_TEMP/engine/web/index.html" "$out/krkrz.html"
            ls -l "$out" | tee results/build.log
          else
            kirikiri/kagex/.github/platforms/run-logged.sh build make -C kirikiri/krkrz_web prebuild build
          fi
      - name: Stage the site
        run: |
          kirikiri/kagex/.github/platforms/run-logged.sh stage python3 kirikiri/krkrz_web/tools/stage_web.py "$PROJECT_DIR"
          site="$PROJECT_DIR/build/web/site"
          # GitHub Pages can't send the COOP/COEP headers that SharedArrayBuffer needs:
          # coi-serviceworker adds them in the browser (as krkrz_web's stage_docs.py does); a
          # reused engine's page has it already
          cp kirikiri/krkrz_web/tools/coi-serviceworker.js "$site/"
          python3 - "$site/index.html" <<'PY'
          import sys
          sys.path.insert(0, "kirikiri/krkrz_web/tools")
          from stage_docs import inject_coi
          p = sys.argv[1]
          html = open(p, encoding="utf-8").read()
          if 'src="coi-serviceworker.js"' not in html:
              open(p, "w", encoding="utf-8").write(inject_coi(html, "coi-serviceworker.js"))
          PY
          # the file list where a static host serves it, coi's reload after its worker is ready,
          # and the home-screen manifest and icons
          python3 kirikiri/kagex/.github/platforms/web-static-host.py "$site" | tee results/web-static-host.txt
          (cd "$site" && find . -type f | sort) > results/site-files.txt
          du -sh "$site" | tee -a results/site-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-web
          path: kirikiri/kagex/build/web/site
          if-no-files-found: error
      - name: Smoke test in headless Chromium
        timeout-minutes: 20
        run: |
          # the runner's own Chrome: Playwright's browser download installs its system
          # dependencies with apt, which once took 20 minutes here
          python3 -m pip install --quiet playwright
          google-chrome --version | tee results/chrome.txt
          # a plain static server, as on GitHub Pages (serve.py adds the headers and the file
          # list itself, which hid a site that didn't start there)
          (cd "$PROJECT_DIR/build/web/site" && exec python3 -m http.server 8100 > "$GITHUB_WORKSPACE/results/serve.log" 2>&1) &
          sleep 3
          s=0
          kirikiri/kagex/.github/platforms/run-logged.sh smoke python3 -B "$PROJECT_DIR/tools/smoketest.py" --target web --url http://localhost:8100/ --channel chrome --keep --effekseer required --alphamovie required --three required --vector required --zip required --clip required --encryption required --live2d required || s=$?
          cp /tmp/kagex-smoke-*/console.txt /tmp/kagex-smoke-*/*.png results/ 2>/dev/null || true
          exit $s
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: kirikiri/kagex/.github/platforms/publish-results.sh web "web, run ${{ github.run_id }} (${{ job.status }})"
      - name: Stop the whole run on a failure
        # a failed job cancels the others (iOS and Android take the longest), so a
        # release that can't publish stops at once
        if: failure() && github.workflow == 'Release packages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  android:
    needs: [select, scenarios]
    if: contains(needs.select.outputs.list, ' android ')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KRKRZ_BASE: ${{ github.workspace }}/kirikiri
      PROJECT_DIR: ${{ github.workspace }}/kirikiri/kagex
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: kirikiri/kagex
      - uses: actions/download-artifact@v4
        with:
          name: kagex-scenarios
          path: ${{ runner.temp }}/scenarios
      - name: Put the compiled scenarios into the project
        run: tar xzf "$RUNNER_TEMP/scenarios/scenarios.tgz" -C kirikiri/kagex && ls kirikiri/kagex/data/scenario/*.scn*
      - name: An earlier release's build of this engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ needs.select.outputs.rebuild }}
          REUSE_FROM: ${{ needs.select.outputs.reuse_from }}
          ENGINE_KEY_DIR: ${{ runner.temp }}/engine-key
          ENGINE_DIR: ${{ runner.temp }}/engine
        run: |
          mkdir -p results
          python3 kirikiri/kagex/.github/platforms/platform-engine.py find android "$GITHUB_OUTPUT" | tee results/engine.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-engine-key-android
          path: ${{ runner.temp }}/engine-key/android.key
          if-no-files-found: error
      - name: Clone the engine and krkrz_android
        if: steps.engine.outputs.reuse == ''
        run: kirikiri/kagex/.github/platforms/setup.sh krkrz_android "$KRKRZ_ANDROID_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # the engine package is the kit's Gradle project with the engine prebuilt (as kagex-release
      # packages a game with it): only the SDK's platform and build tools, no NDK, CMake or vcpkg.
      # Its engine is the release build's, which has no REPL (the kit compiles it into Debug
      # builds only): the debug APK gets the debug package's engine (app/src/main/jniLibs)
      - name: The reused engine's Gradle project
        if: steps.engine.outputs.reuse != ''
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          kirikiri/kagex/.github/platforms/run-logged.sh sdk "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          proj="$RUNNER_TEMP/android"
          rm -rf "$proj" "$RUNNER_TEMP/android-engine" "$RUNNER_TEMP/android-engine-debug" "$RUNNER_TEMP/jnilibs" && mkdir -p "$RUNNER_TEMP/android-engine" "$RUNNER_TEMP/jnilibs"
          unzip -q "$RUNNER_TEMP/engine/kagex_engine_android.zip" 'project/*' -d "$RUNNER_TEMP/android-engine"
          mv "$RUNNER_TEMP/android-engine/project" "$proj"
          mv "$proj/app/src/main/jniLibs" "$RUNNER_TEMP/jnilibs/release"
          unzip -q "$RUNNER_TEMP/engine/kagex_engine_android_debug.zip" 'project/app/src/main/jniLibs/*' -d "$RUNNER_TEMP/android-engine-debug"
          mv "$RUNNER_TEMP/android-engine-debug/project/app/src/main/jniLibs" "$RUNNER_TEMP/jnilibs/debug"
          for so in "$RUNNER_TEMP"/jnilibs/debug/*/libkrkrz.so; do
            grep -q KRKRZ_REPL_SOCKET "$so" || { echo "::error::$so, the debug engine package's engine, has no REPL"; exit 1; }
          done
          chmod +x "$proj/gradlew"
          echo "sdk.dir=$sdk" > "$proj/local.properties"
          # the game's app-config.json, but the engine's own assets from the package (krkrz_dev's
          # resource folder in the kit's build, which isn't cloned here)
          python3 - "$PROJECT_DIR/app-config.json" "$proj/engine-assets" "$RUNNER_TEMP/app-config.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              cfg = json.load(f)
          first = cfg["assetPack"]["sources"][0]
          assert first["from"].endswith("krkrz_dev/src/core/resource"), first
          first["from"] = sys.argv[2]
          with open(sys.argv[3], "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
          PY
          echo "ANDROID_PROJECT=$proj" >> "$GITHUB_ENV"
          echo "APP_CONFIG_FILE=$RUNNER_TEMP/app-config.json" >> "$GITHUB_ENV"
      - name: Set up the Android SDK, vcpkg and SDL3
        if: steps.engine.outputs.reuse == ''
        run: |
          ndk=$(python3 -c "import json; print(json.load(open('$PROJECT_DIR/app-config.json'))['ndkVersion'])")
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # The kit asks for the SDK's CMake 3.22.1, but krkr_richtext makes the engine download
          # ICU with an option CMake 3.24 added (DOWNLOAD_EXTRACT_TIMESTAMP): use the newest 3.x
          cmake=$("$sdk/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -oE 'cmake;3\.[0-9]+\.[0-9]+' | sort -u -t. -k2,2n -k3,3n | tail -1)
          echo "using $cmake" | tee results/cmake.txt
          kirikiri/kagex/.github/platforms/run-logged.sh sdk "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ndk" "$cmake" "platforms;android-36" "build-tools;36.0.0"
          sed -i -E "s/version = \"3\.22\.1\"/version = \"${cmake#cmake;}\"/" kirikiri/krkrz_android/app/build.gradle
          grep -n "version = \"${cmake#cmake;}\"" kirikiri/krkrz_android/app/build.gradle
          # the bootstrap copies the game files once at a time (a restarted loading screen ran a
          # second copy alongside the first, which left the engine without its data)
          git -C kirikiri/krkrz_android apply "$PROJECT_DIR/.github/platforms/kit-android-bootstrap.patch"
          # Back is the game's Esc (the history, a prompt, a screen; the title asks to quit): the
          # kit let Android leave the game, or (before Android 13) sent a key the engine has no name for
          git -C kirikiri/krkrz_android apply "$PROJECT_DIR/.github/platforms/kit-android-back.patch"
          echo "sdk.dir=$sdk" > kirikiri/krkrz_android/local.properties
          python3 kirikiri/kagex/.github/platforms/kit-vcpkg.py kirikiri/krkrz_android/app/src/main/cpp/vcpkg.json
          echo "include(\"$PROJECT_DIR/.github/platforms/krkreffekseer-kit.cmake\")" >> kirikiri/krkrz_android/app/src/main/cpp/CMakeLists.txt
          echo "include(\"$PROJECT_DIR/.github/platforms/monocypher-kit.cmake\")" >> kirikiri/krkrz_android/app/src/main/cpp/CMakeLists.txt
          echo "include(\"$PROJECT_DIR/.github/platforms/krkrthreepp-kit.cmake\")" >> kirikiri/krkrz_android/app/src/main/cpp/CMakeLists.txt
          chmod +x kirikiri/krkrz_android/gradlew
          git clone -q https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          # libvpx for x86_64 (the emulator's ABI) assembles with nasm
          sudo timeout 600 apt-get install -y -q --no-install-recommends -o DPkg::Lock::Timeout=300 nasm > results/apt.log 2>&1
          mkdir -p kirikiri/krkrz_android/app/libs
          (cd kirikiri/krkrz_android && bash install-sdl-aar.sh) > results/sdl-aar.log 2>&1
      - name: Build the debug APK
        env:
          REUSE: ${{ steps.engine.outputs.reuse }}
        run: |
          if [ -n "$REUSE" ]; then
            rm -rf "$ANDROID_PROJECT/app/src/main/jniLibs" && cp -R "$RUNNER_TEMP/jnilibs/debug" "$ANDROID_PROJECT/app/src/main/jniLibs"
            (cd "$ANDROID_PROJECT" && "$GITHUB_WORKSPACE/kirikiri/kagex/.github/platforms/run-logged.sh" build ./gradlew --no-daemon :app:assembleDebug)
          else
            kirikiri/kagex/.github/platforms/run-logged.sh build make -C kirikiri/krkrz_android build
          fi
      - name: List the APK
        run: |
          find "$PROJECT_DIR/build/android" -name '*.apk' -exec ls -l {} \; | tee results/apk.txt
          apk=$(find "$PROJECT_DIR/build/android" -name '*.apk' | head -1)
          unzip -l "$apk" | grep -E 'lib/|assets/data/(startup|system/Initialize)' | tee -a results/apk.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-android-debug
          path: kirikiri/kagex/build/android/app/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "APK=$(find "$PROJECT_DIR/build/android/app/outputs/apk/debug" -name '*.apk' | head -1)" >> "$GITHUB_ENV"
      - name: Smoke test on an emulator
        timeout-minutes: 45
        env:
          KAGEX_SMOKE_HUNT: ${{ inputs.hunt }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: kirikiri/kagex/.github/platforms/run-logged.sh smoke python3 -B kirikiri/kagex/tools/smoketest.py --target android --apk "$APK" --keep --effekseer required --alphamovie required --three required --vector required --zip required --clip required --encryption required; s=$?; cp /tmp/kagex-smoke-*/logcat.txt /tmp/kagex-smoke-*/*.png /tmp/kagex-smoke-*/hang-*.txt results/ 2>/dev/null; exit $s
      # The smoke test needs the debug build (only it has the REPL); the package is the
      # optimized release build, signed with the same debug key (the kit's release-debug)
      - name: Build the release APK
        env:
          REUSE: ${{ steps.engine.outputs.reuse }}
        run: |
          # Gradle downloads lint's own dependencies here; a download cut off midway once
          # failed this step, so it gets three tries
          if [ -n "$REUSE" ]; then
            rm -rf "$ANDROID_PROJECT/app/src/main/jniLibs" && cp -R "$RUNNER_TEMP/jnilibs/release" "$ANDROID_PROJECT/app/src/main/jniLibs"
          fi
          for try in 1 2 3; do
            if [ -n "$REUSE" ]; then
              (cd "$ANDROID_PROJECT" && "$GITHUB_WORKSPACE/kirikiri/kagex/.github/platforms/run-logged.sh" release ./gradlew --no-daemon :app:assembleReleaseDebugSigned) && break
            else
              kirikiri/kagex/.github/platforms/run-logged.sh release make -C kirikiri/krkrz_android release-debug && break
            fi
            [ "$try" = 3 ] && exit 1
            sleep 30
          done
          find "$PROJECT_DIR/build/android" -name '*.apk' -exec ls -l {} \; | tee -a results/apk.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-android
          path: kirikiri/kagex/build/android/app/outputs/apk/releaseDebugSigned/*.apk
          if-no-files-found: error
      # kagex-release's Android engine: this Gradle project with the engine just built, prebuilt;
      # and the same with the debug APK's engine, which a later release's reuse builds its debug
      # APK from (it has the REPL the smoke test drives)
      - name: Engine package for kagex-release
        env:
          REUSE: ${{ steps.engine.outputs.reuse }}
        run: |
          apk=$(find "$PROJECT_DIR/build/android/app/outputs/apk/releaseDebugSigned" -name '*.apk' | head -1)
          debug_apk=$(find "$PROJECT_DIR/build/android/app/outputs/apk/debug" -name '*.apk' | head -1)
          version=$(python3 -c "import json; print(json.load(open('$PROJECT_DIR/linux-config.json'))['version'])")
          if [ -n "$REUSE" ]; then
            # the same engine: the reused packages, for this release
            for z in kagex_engine_android.zip kagex_engine_android_debug.zip; do
              cp "$RUNNER_TEMP/engine/$z" "$z"
              python3 kirikiri/kagex/.github/platforms/platform-engine.py version "$z" "$version" | tee -a results/engine-package.txt
            done
          else
            python3 -I kirikiri/kagex/tools/release/scripts/android-engine.py kirikiri/krkrz_android "$apk" kagex_engine_android.zip \
              --version "$version" --app-config "$PROJECT_DIR/app-config.json" | tee results/engine-package.txt
            python3 -I kirikiri/kagex/tools/release/scripts/android-engine.py kirikiri/krkrz_android "$debug_apk" kagex_engine_android_debug.zip \
              --version "$version" --app-config "$PROJECT_DIR/app-config.json" --debug | tee -a results/engine-package.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-engine-android
          path: kagex_engine_android.zip
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-engine-android-debug
          path: kagex_engine_android_debug.zip
          compression-level: 0
          if-no-files-found: error
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: kirikiri/kagex/.github/platforms/publish-results.sh android "android, run ${{ github.run_id }} (${{ job.status }})"
      - name: Stop the whole run on a failure
        # a failed job cancels the others (iOS and Android take the longest), so a
        # release that can't publish stops at once
        if: failure() && github.workflow == 'Release packages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  ios:
    needs: [select, scenarios]
    if: contains(needs.select.outputs.list, ' ios ')
    runs-on: macos-15
    timeout-minutes: 300
    env:
      KRKRZ_BASE: ${{ github.workspace }}/kirikiri
      PROJECT_DIR: ${{ github.workspace }}/kirikiri/kagex
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: kirikiri/kagex
      - uses: actions/download-artifact@v4
        with:
          name: kagex-scenarios
          path: ${{ runner.temp }}/scenarios
      - name: Put the compiled scenarios into the project
        run: tar xzf "$RUNNER_TEMP/scenarios/scenarios.tgz" -C kirikiri/kagex && ls kirikiri/kagex/data/scenario/*.scn*
      - name: An earlier release's build of this engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ needs.select.outputs.rebuild }}
          REUSE_FROM: ${{ needs.select.outputs.reuse_from }}
          ENGINE_KEY_DIR: ${{ runner.temp }}/engine-key
          ENGINE_DIR: ${{ runner.temp }}/engine
        run: |
          mkdir -p results
          python3 kirikiri/kagex/.github/platforms/platform-engine.py find ios "$GITHUB_OUTPUT" | tee results/engine.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-engine-key-ios
          path: ${{ runner.temp }}/engine-key/ios.key
          if-no-files-found: error
      - name: Clone the engine and krkrz_ios
        if: steps.engine.outputs.reuse == ''
        run: kirikiri/kagex/.github/platforms/setup.sh krkrz_ios "$KRKRZ_IOS_SHA"
      - name: Set up vcpkg
        if: steps.engine.outputs.reuse == ''
        run: |
          git clone -q https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          xcodebuild -version | tee results/xcode.txt
      - name: Build for the Simulator
        env:
          REUSE: ${{ steps.engine.outputs.reuse }}
        run: |
          if [ -n "$REUSE" ]; then
            # the engine package's Simulator app (the kit's, without the game), the game put in as
            # ios-config.json's assetPack puts it, this release's version, signed ad hoc again as
            # the build signs it
            app="$PROJECT_DIR/build/ios/reused/Debug-iphonesimulator/krkrz.app"
            rm -rf "$RUNNER_TEMP/ios-engine" "$PROJECT_DIR/build/ios/reused"
            mkdir -p "$RUNNER_TEMP/ios-engine" "$(dirname "$app")"
            unzip -q "$RUNNER_TEMP/engine/kagex_engine_ios.zip" 'simulator/*' -d "$RUNNER_TEMP/ios-engine"
            ditto "$RUNNER_TEMP/ios-engine/simulator/krkrz.app" "$app"
            rsync -a --exclude '*.bak' --exclude '*.psd' "$PROJECT_DIR/data/" "$app/data/"
            rsync -a "$PROJECT_DIR/template/system/" "$app/data/system/"
            conf() { python3 -c "import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])" "$PROJECT_DIR/ios-config.json" "$1"; }
            plutil -replace CFBundleShortVersionString -string "$(conf version)" "$app/Info.plist"
            plutil -replace CFBundleVersion -string "$(conf build)" "$app/Info.plist"
            codesign --force --sign - "$app"
            codesign --verify "$app"
            { plutil -p "$app/Info.plist"; find "$app" -maxdepth 1 | sort; } | tee results/build.log
          else
            # every plugin is static on iOS: scnfile's Monocypher is renamed beside xp3crypt's
            echo "include(\"$PROJECT_DIR/.github/platforms/monocypher-kit.cmake\")" >> kirikiri/krkrz_ios/CMakeLists.txt
            echo "include(\"$PROJECT_DIR/.github/platforms/krkrthreepp-kit.cmake\")" >> kirikiri/krkrz_ios/CMakeLists.txt
            kirikiri/kagex/.github/platforms/run-logged.sh build make -C kirikiri/krkrz_ios build
          fi
      - name: Pack the app
        run: |
          app=$(find "$PROJECT_DIR/build/ios" -name '*.app' -path '*iphonesimulator*' | head -1)
          [ -n "$app" ] || { echo "::error::no .app"; exit 1; }
          echo "$app" | tee results/app.txt
          ls "$app" | tee -a results/app.txt
          ditto -c -k --keepParent "$app" kagex-ios-simulator.zip
          echo "APP=$app" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-ios-simulator
          path: kagex-ios-simulator.zip
          if-no-files-found: error
      - name: Smoke test in the Simulator
        timeout-minutes: 30
        run: |
          dev=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "device $dev" | tee results/simulator.txt
          xcrun simctl boot "$dev" || true
          xcrun simctl bootstatus "$dev" -b > /dev/null
          s=0
          kirikiri/kagex/.github/platforms/run-logged.sh smoke python3 -B kirikiri/kagex/tools/smoketest.py --target ios-sim --app "$APP" --device "$dev" --keep --three required --alphamovie required --vector required --zip required --clip required --encryption required || s=$?
          cp "${TMPDIR:-/tmp}"/kagex-smoke-*/simulator.log "${TMPDIR:-/tmp}"/kagex-smoke-*/*.png results/ 2>/dev/null || true
          exit $s
      # kagex-release's iOS engine: an unsigned Release build for devices (the developer's
      # certificate signs it) and the Simulator app, without the game
      - name: Engine package for kagex-release, reused
        if: steps.engine.outputs.reuse != ''
        run: |
          version=$(python3 -c "import json; print(json.load(open('$PROJECT_DIR/linux-config.json'))['version'])")
          cp "$RUNNER_TEMP/engine/kagex_engine_ios.zip" kagex_engine_ios.zip
          python3 kirikiri/kagex/.github/platforms/platform-engine.py version kagex_engine_ios.zip "$version" | tee results/engine-package.txt
      - name: Build for devices, unsigned
        if: steps.engine.outputs.reuse == ''
        run: |
          kirikiri/kagex/.github/platforms/run-logged.sh device-configure make -C kirikiri/krkrz_ios dist-configure
          kirikiri/kagex/.github/platforms/run-logged.sh device-build xcodebuild -project "$PROJECT_DIR/build/ios/dist/krkrz_ios.xcodeproj" \
            -target krkrz -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          dapp=$(find "$PROJECT_DIR/build/ios/dist" -name '*.app' -path '*iphoneos*' | head -1)
          [ -n "$dapp" ] || { echo "::error::no device .app"; exit 1; }
          ditto -c -k --keepParent "$dapp" ios-device.zip
          version=$(python3 -c "import json; print(json.load(open('$PROJECT_DIR/linux-config.json'))['version'])")
          python3 -I kirikiri/kagex/tools/release/scripts/ios-engine.py --device ios-device.zip --simulator kagex-ios-simulator.zip \
            kagex_engine_ios.zip --version "$version" | tee results/engine-package.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-engine-ios
          path: kagex_engine_ios.zip
          compression-level: 0
          if-no-files-found: error
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: kirikiri/kagex/.github/platforms/publish-results.sh ios "ios, run ${{ github.run_id }} (${{ job.status }})"
      - name: Stop the whole run on a failure
        # a failed job cancels the others (iOS and Android take the longest), so a
        # release that can't publish stops at once
        if: failure() && github.workflow == 'Release packages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  macos:
    needs: [select, scenarios]
    if: contains(needs.select.outputs.list, ' macos ')
    runs-on: macos-15
    timeout-minutes: 300
    env:
      KRKRZ_BASE: ${{ github.workspace }}/kirikiri
      PROJECT_DIR: ${{ github.workspace }}/kirikiri/kagex
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: kirikiri/kagex
      - uses: actions/download-artifact@v4
        with:
          name: kagex-scenarios
          path: ${{ runner.temp }}/scenarios
      - name: Put the compiled scenarios into the project
        run: tar xzf "$RUNNER_TEMP/scenarios/scenarios.tgz" -C kirikiri/kagex && ls kirikiri/kagex/data/scenario/*.scn*
      - name: An earlier release's build of this engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ needs.select.outputs.rebuild }}
          REUSE_FROM: ${{ needs.select.outputs.reuse_from }}
          ENGINE_KEY_DIR: ${{ runner.temp }}/engine-key
          ENGINE_DIR: ${{ runner.temp }}/engine
        run: |
          mkdir -p results
          python3 kirikiri/kagex/.github/platforms/platform-engine.py find macos "$GITHUB_OUTPUT" | tee results/engine.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-engine-key-macos
          path: ${{ runner.temp }}/engine-key/macos.key
          if-no-files-found: error
      - name: Clone the engine
        if: steps.engine.outputs.reuse == ''
        run: kirikiri/kagex/.github/platforms/setup.sh
      - name: Set up vcpkg and ninja
        if: steps.engine.outputs.reuse == ''
        run: |
          git clone -q https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          command -v ninja || brew install ninja
          { sw_vers; xcodebuild -version; cmake --version | head -1; } | tee results/toolchain.txt
      - name: Configure
        if: steps.engine.outputs.reuse == ''
        working-directory: kirikiri/krkrz_dev
        # xp3crypt built into the engine, scnfile a plugin beside it. The plugin folders' tp_stub,
        # ncbind and simplebinder are krkrz_dev's: the first plugin's CMakeLists caches them
        # relative to itself, and xp3crypt comes first
        run: |
          p="$KRKRZ_BASE/krkrz_dev/src/plugins"
          $GITHUB_WORKSPACE/kirikiri/kagex/.github/platforms/run-logged.sh configure cmake --preset arm64-osx -DKRKRZ_BUILD_TOOLS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/kirikiri/kagex/.github/platforms/krkreffekseer-apple.cmake" \
            "-DTVP_PLUGIN_FOLDERS=$KRKRZ_BASE/xp3crypt/plugins;$KRKRZ_BASE/scnfile/plugins" "-DTVP_PLUGINS=xp3crypt;scnfile" -DTVP_PLUGINS_STATIC=xp3crypt \
            "-DTPSTUB_DIR=$p/tp_stub" "-DNCBIND_DIR=$p/ncbind" "-DSIMPLEBIND_DIR=$p/simplebinder"
      - name: Build the engine and its plugins
        if: steps.engine.outputs.reuse == ''
        working-directory: kirikiri/krkrz_dev
        run: $GITHUB_WORKSPACE/kirikiri/kagex/.github/platforms/run-logged.sh build cmake --build build/arm64-osx --config Release -- -k 0
      - name: Install
        if: steps.engine.outputs.reuse == ''
        working-directory: kirikiri/krkrz_dev
        run: |
          $GITHUB_WORKSPACE/kirikiri/kagex/.github/platforms/run-logged.sh install cmake --install build/arm64-osx --config Release --prefix "$GITHUB_WORKSPACE/stage"
          find "$GITHUB_WORKSPACE/stage" -maxdepth 4 | sort | tee "$GITHUB_WORKSPACE/results/install.txt"
      # the engine package is the app as installed, without signature, data or .cf (and the
      # licenses beside it): the next step makes it this release's app, as after a build
      - name: Install, reused
        if: steps.engine.outputs.reuse != ''
        run: |
          rm -rf stage && mkdir -p stage
          unzip -q "$RUNNER_TEMP/engine/kagex_engine_macos.zip" -d stage
          rm -f stage/engine.json
          find stage -maxdepth 4 | sort | tee results/install.txt
      - name: Put the game in the app
        run: |
          built=$(find stage -maxdepth 3 -name '*.app' | head -1)
          [ -n "$built" ] || { echo "::error::no .app in the install"; exit 1; }
          app=stage/KAGEX.app
          [ "$built" = "$app" ] || mv "$built" "$app"
          res="$app/Contents/Resources"
          mkdir -p "$res"
          rsync -a --exclude '*.bak' --exclude '*.psd' "$PROJECT_DIR/data/" "$res/data/"
          rsync -a "$PROJECT_DIR/template/system/" "$res/data/system/"
          cp "$PROJECT_DIR/krkrz.cf" "$res/"
          cp "$PROJECT_DIR/krkrz.cf" "$app/Contents/MacOS/"
          # the sample's name, bundle id, version and icon (platform/icon-1024.png, drawn by
          # tools/assets/make_ui.py icons)
          plist="$app/Contents/Info.plist"
          set_plist() { /usr/libexec/PlistBuddy -c "Set :$1 $2" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$plist"; }
          set_plist CFBundleName KAGEX
          set_plist CFBundleDisplayName KAGEX
          set_plist CFBundleIdentifier io.github.krkren.kagex
          set_plist CFBundleShortVersionString "$(python3 -c "import json; print(json.load(open('$PROJECT_DIR/ios-config.json'))['version'])")"
          set_plist CFBundleVersion "$(python3 -c "import json; print(json.load(open('$PROJECT_DIR/ios-config.json'))['build'])")"
          iconset="$RUNNER_TEMP/kagex.iconset"
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s "$PROJECT_DIR/platform/icon-1024.png" --out "$iconset/icon_${s}x${s}.png" > /dev/null
            sips -z $((s * 2)) $((s * 2)) "$PROJECT_DIR/platform/icon-1024.png" --out "$iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$res/kagex.icns"
          set_plist CFBundleIconFile kagex
          # Adding files and changing Info.plist broke the build's ad-hoc signature, which macOS
          # reports as a damaged app: sign it again, still ad hoc (there's no Developer ID)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c Print "$plist" > results/Info.plist.txt
          find "$app" -maxdepth 3 | sort | tee results/app.txt
          echo "APP=$GITHUB_WORKSPACE/$app" >> "$GITHUB_ENV"
      - name: Pack the app
        run: ditto -c -k --keepParent "$APP" kagex-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kagex-macos
          path: kagex-macos.zip
          if-no-files-found: error
      - name: Smoke test
        timeout-minutes: 20
        run: |
          exe="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          # the game as the app holds it (the app has no template/). SDL's offscreen driver has
          # no OpenGL ES here (the engine draws through ANGLE), but the runners have a desktop
          cd "$APP/Contents/Resources"
          SDL_VIDEO_DRIVER=cocoa $GITHUB_WORKSPACE/kirikiri/kagex/.github/platforms/run-logged.sh smoke python3 -B "$PROJECT_DIR/tools/smoketest.py" --engine "$exe" --only sample --effekseer required --three required --vector required --zip required --clip required --encryption required
      - name: Publish results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: kirikiri/kagex/.github/platforms/publish-results.sh macos "macos, run ${{ github.run_id }} (${{ job.status }})"
      - name: Stop the whole run on a failure
        # a failed job cancels the others (iOS and Android take the longest), so a
        # release that can't publish stops at once
        if: failure() && github.workflow == 'Release packages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
